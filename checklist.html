<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3ef">
<script>
/* 06/10: segue o tema escolhido no painel (mesma chave painelTema). Antes esta pagina so
   olhava o prefers-color-scheme, entao quem punha o painel no escuro e clicava aqui caia
   numa pagina clara. Roda antes de pintar para nao piscar. */
/* 10/10: a paleta acompanha o painel */
(function(){var p;try{p=localStorage.getItem('painelPaleta');}catch(e){}
 document.documentElement.setAttribute('data-paleta',p==='terracota'?'terracota':'azul');})();
(function(){var t;try{t=localStorage.getItem('painelTema');}catch(e){}
 if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}
 document.documentElement.setAttribute('data-tema',t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute('content',t==='claro'?'#f4f3ef':'#161615');})();
</script>
<title>Checklist de medições — Obras FDE</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#dcdad3;--pri:#c2501f;--priBar:#c2501f;--ok:#2f6f4e;--okb:#e6f4ec;--bad:#b3261e;--badb:#fbe0de;--warn:#9a6b00;--warnb:#fdf4de;--na:#6b6b66;--nab:#eeede8}
/* 06/10: o tema agora vem do data-tema (painelTema); o prefers-color-scheme fica
   so para quem abrir sem JS. --pri clareia para servir de texto no escuro e a barra
   do topo ganha --priBar, que escurece: antes ela clareava com o texto branco em
   cima e o contraste caia para 2,29:1. */
@media (prefers-color-scheme:dark){html:not([data-tema]){--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#e8825a;--priBar:#a6431a;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420;--na:#a3a29c;--nab:#2c2b28}}
html[data-tema="escuro"]{--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#e8825a;--priBar:#a6431a;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420;--na:#a3a29c;--nab:#2c2b28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--priBar);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;flex:1;min-width:200px}
header.top a{color:#fff;font-size:13px;opacity:.85}
main{max-width:1240px;margin:0 auto;padding:12px 16px 60px}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;min-height:34px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}
.sync{font-size:12.5px;color:var(--mut)}.sync.ok{color:var(--ok)}.sync.err{color:var(--bad)}
h2{font-size:14px;margin:18px 0 6px;color:var(--pri)}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);background:var(--nab)}
td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
tr.okrow td{background:color-mix(in srgb,var(--okb) 45%,transparent)}
.obra b{display:block}.obra span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-bad{background:var(--badb);color:var(--bad)}.p-warn{background:var(--warnb);color:var(--warn)}.p-na{background:var(--nab);color:var(--na)}
.tg{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.rfb{display:flex;gap:5px;flex-wrap:wrap}
.tg.on{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:650}
.tg.on.no{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
.obs{width:100%;min-width:140px}
.auto{font-size:11px;color:var(--mut)}
@media (max-width:760px){
  thead{display:none} table,tbody,tr,td{display:block;width:100%} tr{border-bottom:2px solid var(--ln);padding:6px 0}
  td{border:0;padding:4px 10px} td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
}
</style>

     origem), o "voltar ao painel" nao serve: ele recarregaria o painel inteiro
     DENTRO do quadro. Some, e o quadro cresce ate a altura do conteudo para nao
     existir rolagem dentro de rolagem. -->

html.emb,html.emb body{overflow-x:hidden}
html.emb body{padding-bottom:0}</style>

<!-- 10/10: V2 Liquid Glass. Camada compartilhada; so @media screen, a impressao nao muda. -->
<link rel="stylesheet" href="v2.css?v=202610101741">
</head>
<body>
<header class="top"><h1>Checklist de medições</h1><a href="./">← voltar ao painel</a></header>
<main id="app"><p>Carregando…</p></main>
<script src="chk.js?v=202610101741"></script>
<script src="entregas.js"></script>
<script>
(function(){
'use strict';
/* 02/10/2026 — checklist mensal por obra: a medicao foi inserida no portal ou enviada por e-mail,
   a situacao dela (da varredura do portal / CTR) e se o relatorio fotografico foi gerado e enviado.
   O que se marca aqui vai para o servidor comum do painel (o mesmo das entregas dos pedidos),
   como JSON {tipo:'chk', k:'obra|aaaa-mm', campo, v, por, quando}; todo aparelho le de la. */
var D=window.CHK, SRV=window.ENTREGAS_SRV||{}, QCH='fdeEntregasQuem', FCH='chkFila';
var app=document.getElementById('app');
if(!D){ app.innerHTML='<p>Os dados do checklist (chk.js) não carregaram. Atualize a página.</p>'; return; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function agora(){ var d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function ts(q){ var m=/^(\d{2})\/(\d{2})\/(\d{4})[ ,]+(\d{2}):(\d{2})/.exec(q||''); return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).getTime():0; }
function dbr(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m?m[3]+'/'+m[2]+'/'+m[1]:''; }
var MES=['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function mesNome(k){ var p=k.split('-'); return MES[+p[1]]+'/'+p[0]; }

/* 08/10: sem escolha salva, abre na competencia que esta sendo inserida agora (ate o dia 20 = mes anterior) */
var F={mes:ls('chkMes')||((new Date().getDate()<=20&&D.meses[1])?D.meses[1]:D.meses[0]), eng:ls('chkEng')||'', lote:'', pend:ls('chkPend')==='1', lib:ls('chkLib')==='1', busca:'', obra:''};
if(D.meses.indexOf(F.mes)<0) F.mes=D.meses[0];
var M={}; /* k|campo -> {v,por,quando} vindo do servidor + fila local */
var SY={st:'carregando',hora:''};

function csv(t){ var L=[], r=[], f='', q=false; for(var i=0;i<t.length;i++){ var ch=t[i];
  if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
  else if(ch==='"') q=true; else if(ch===','){ r.push(f); f=''; }
  else if(ch==='\n'){ r.push(f); L.push(r); r=[]; f=''; } else if(ch!=='\r') f+=ch; }
  if(f||r.length){ r.push(f); L.push(r); } return L; }
function fila(){ try{ return JSON.parse(ls(FCH)||'[]'); }catch(e){ return []; } }
function aplica(m){ var id=m.k+'|'+m.campo, a=M[id]; if(!a||ts(m.quando)>=ts(a.quando)) M[id]={v:m.v,por:m.por||'',quando:m.quando||''}; }
function puxa(){
  if(!SRV.ler){ SY.st='local'; fila().forEach(aplica); render(); return Promise.resolve(); }
  return fetch(SRV.ler+'&t='+Date.now()).then(function(r){ return r.text(); }).then(function(t){
    if(/<html/i.test(t.slice(0,200))) throw new Error('privada');
    M={}; csv(t).slice(1).forEach(function(l){ var m; try{ m=JSON.parse(l[1]); }catch(e){ return; } if(m&&m.tipo==='chk'&&m.k&&m.campo) aplica(m); });
    var l=fila().filter(function(x){ var a=M[x.k+'|'+x.campo]; return !(a&&a.quando===x.quando&&String(a.v)===String(x.v)); });
    ls(FCH,JSON.stringify(l)); l.forEach(aplica);
    SY.st=l.length?'pend':'ok'; SY.hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); render();
  }).catch(function(){ fila().forEach(aplica); SY.st='erro'; render(); });
}
function envia(){ var l=fila(); if(!SRV.form||!l.length) return;
  Promise.all(l.map(function(m){ var fd=new FormData(); fd.append(SRV.entry,JSON.stringify(m)); return fetch(SRV.form,{method:'POST',mode:'no-cors',body:fd}); }))
   .then(function(){ setTimeout(puxa,2500); }).catch(function(){ SY.st='erro'; pintaSync(); }); }
function marca(k,campo,v){
  var q=(ls(QCH)||'').trim(); if(!q){ var e=document.getElementById('fQuem'); if(e){ e.focus(); e.style.borderColor='var(--bad)'; e.placeholder='digite seu nome para marcar'; } return false; }
  var m={tipo:'chk',k:k,campo:campo,v:v,por:q,quando:agora()};
  var l=fila().filter(function(x){ return !(x.k===k&&x.campo===campo); }); l.push(m); ls(FCH,JSON.stringify(l));
  aplica(m); SY.st='pend'; clearTimeout(marca._t); marca._t=setTimeout(envia,700); return true; }
function val(k,c){ var a=M[k+'|'+c]; return a?a.v:null; }
function quem(k,cs){ var b=null; cs.forEach(function(c){ var a=M[k+'|'+c]; if(a&&(!b||ts(a.quando)>ts(b.quando))) b=a; }); return b; }

/* 08/10: LIBERADA PARA INSERIR. Regra do Luis: o portal so abre a medicao do mes quando a
   medicao anterior esta APROVADA. Usa o historico da obra (D.hist: [comp, n, situacao, data aprov.]),
   ignorando 0. PREVISAO (nao e medicao lancada). Primeira medicao da obra = liberada. */
function mesAnt(k){ var p=k.split('-'), y=+p[0], m=+p[1]-1; if(!m){ m=12; y--; } return y+'-'+(m<10?'0':'')+m; }
function mesCurto(k){ var p=k.split('-'); return MES[+p[1]].slice(0,3)+'/'+p[0].slice(2); }
function sitTxt(s){ var r=String(s||'').replace(/^[\d.]+\s*/,''); return r?r.charAt(0)+r.slice(1).toLowerCase():'—'; }
function libera(o,k){
  var h=((D.hist||{})[String(o.c)]||[]).filter(function(x){ return !/^0/.test(x[2]); });
  var ja=null, ant=null; h.forEach(function(x){ if(x[0]===k) ja=x; else if(x[0]<k) ant=x; });
  if(ja) return {st:'ins', m:ja};
  if(!ant) return {st:'lib', prim:true};
  if(/^4/.test(ant[2])) return ant[0]===mesAnt(k)?{st:'lib', ant:ant}:{st:'falta', ant:ant, falta:mesAnt(k)};
  return {st:'trav', ant:ant};
}
function libCel(L){
  if(L.st==='ins') return '<span class="pill p-na">já inserida</span><div class="mini">M'+esc(L.m[1])+' · '+esc(sitTxt(L.m[2]))+'</div>';
  if(L.st==='lib') return '<span class="pill p-ok">✓ liberada</span><div class="mini">'+(L.prim?'1ª medição da obra':'M'+esc(L.ant[1])+' ('+mesCurto(L.ant[0])+') aprovada'+(L.ant[3]?' em '+esc(L.ant[3]):''))+'</div>';
  if(L.st==='falta') return '<span class="pill p-warn">falta '+mesCurto(L.falta)+'</span><div class="mini">última: M'+esc(L.ant[1])+' ('+mesCurto(L.ant[0])+') aprovada — inserir '+mesCurto(L.falta)+' primeiro</div>';
  return '<span class="pill p-bad">travada</span><div class="mini">M'+esc(L.ant[1])+' ('+mesCurto(L.ant[0])+') em '+esc(sitTxt(L.ant[2]))+'</div>';
}
function sitPill(m){ if(!m) return '<span class="pill p-bad">sem medição no CTR</span>';
  var s=m.sit||'', rot=s.replace(/^[\d.]+\s*/,''), c=/^4/.test(s)?'p-ok':/^3/.test(s)?'p-warn':/^[12]/.test(s)?'p-warn':'p-bad';
  return '<span class="pill '+c+'">'+esc(rot?rot.charAt(0)+rot.slice(1).toLowerCase():'—')+'</span>'; }
function linhas(){
  var med=D.med[F.mes]||{};
  return D.obras.filter(function(o){ return (med[String(o.c)]||/^4\./.test(o.s)); })
    .filter(function(o){ return (!F.obra||String(o.c)===F.obra)&&
      (!F.eng||o.e===F.eng)&&(!F.lote||o.l===F.lote)&&
      (!F.busca||(o.c+' '+o.u).toLowerCase().indexOf(F.busca.toLowerCase())>=0); })
    .map(function(o){ var m=med[String(o.c)]||null, k=o.c+'|'+F.mes, rf=((D.rf||{})[String(o.c)]||{})[F.mes]||'';
      var pMan=val(k,'portal'), em=val(k,'email'), rfe=val(k,'rfenv');
      var ins=!!(m&&m.portal)||pMan===true||pMan==='1';
      var envio=ins||em===true||em==='1';
      /* 02/10: RF enviado por WhatsApp e/ou e-mail (rfwa / rfem); 'rfenv' antigo continua valendo */
      var sim=function(v){ return v===true||v==='1'; }, rfwa=sim(val(k,'rfwa')), rfem=sim(val(k,'rfem'));
      var rfok=sim(rfe)||rfwa||rfem;
      return {lib:libera(o,F.mes),o:o,m:m,k:k,rf:rf,ins:ins,auto:!!(m&&m.portal),em:sim(em),envio:envio,rfg:!!rf,rfok:rfok,rfwa:rfwa,rfem:rfem,rfant:sim(rfe)&&!rfwa&&!rfem,ok:envio&&rfok,obs:val(k,'obs')||''}; })
    .filter(function(x){ return (!F.pend||!x.ok)&&(!F.lib||x.lib.st==='lib'); });
}
function pintaSync(){ var e=document.getElementById('sync'); if(!e) return;
  var n=fila().length; e.className='sync '+(SY.st==='ok'?'ok':SY.st==='erro'?'err':'');
  e.textContent=SY.st==='ok'?('✓ salvo para todos · '+SY.hora):SY.st==='erro'?('⚠ sem conexão com o servidor — '+n+' marcação(ões) guardada(s) neste aparelho'):SY.st==='local'?'⚠ servidor não configurado — marcação só neste aparelho':(n?'salvando… ('+n+')':'carregando…'); }
function render(){
  var y=window.scrollY, foco=document.activeElement&&document.activeElement.id;
  var engs={}; D.obras.forEach(function(o){ if(o.e) engs[o.e]=1; });
  var L=linhas(), tot=L.length;
  var nFal=L.filter(function(x){return x.lib.st==='falta';}).length, nLib=L.filter(function(x){return x.lib.st==='lib';}).length, nTrav=L.filter(function(x){return x.lib.st==='trav';}).length;
  var nIns=L.filter(function(x){return x.ins;}).length, nEm=L.filter(function(x){return x.em;}).length,
      nRfg=L.filter(function(x){return x.rfg;}).length, nRf=L.filter(function(x){return x.rfok;}).length, nOk=L.filter(function(x){return x.ok;}).length;
  var h='<div class="barra">'+
    '<label class="f">Mês de referência<select id="fMes">'+D.meses.map(function(k){ return '<option value="'+k+'"'+(k===F.mes?' selected':'')+'>'+mesNome(k)+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">Engenheiro<select id="fEng"><option value="">todos</option>'+Object.keys(engs).sort().map(function(e){ return '<option'+(e===F.eng?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">Lote<select id="fLote"><option value="">41 e 42</option><option'+(F.lote==='41'?' selected':'')+'>41</option><option'+(F.lote==='42'?' selected':'')+'>42</option></select></label>'+
    '<label class="f">Buscar obra<input id="fBusca" value="'+esc(F.busca)+'" placeholder="nº ou escola"></label>'+
    '<label class="chk"><input type="checkbox" id="fPend"'+(F.pend?' checked':'')+'> só pendentes</label>'+
    '<label class="chk"><input type="checkbox" id="fLib"'+(F.lib?' checked':'')+'> só liberadas para inserir</label>'+
    '<label class="f" style="margin-left:auto">Marcando como<input id="fQuem" value="'+esc(ls(QCH)||'')+'" placeholder="seu nome"></label></div>';
  h+='<div class="kpi"><div><b>'+tot+'</b><span>obras em '+mesNome(F.mes)+'</span></div>'+
     '<div><b>'+nIns+'</b><span>inseridas no portal</span></div><div><b>'+nEm+'</b><span>enviadas por e-mail</span></div>'+
     '<div><b>'+nRfg+'</b><span>RF gerado (pasta da obra)</span></div><div><b>'+nRf+'</b><span>RF enviado</span></div>'+
     '<div><b style="color:var('+(nOk===tot?'--ok':'--bad')+')">'+(tot-nOk)+'</b><span>com pendência</span></div>'+
     '<div><b style="color:var(--ok)">'+nLib+'</b><span>liberadas para inserir</span></div><div><b style="color:var(--bad)">'+nTrav+'</b><span>travadas (anterior não aprovada)</span></div>'+
     (nFal?'<div><b style="color:var(--warn)">'+nFal+'</b><span>falta inserir '+mesCurto(mesAnt(F.mes))+'</span></div>':'')+'</div>';
  /* 08/10: quadro de conferencia rapida — o que da para inserir agora no portal */
  var LL=L.filter(function(x){ return x.lib.st==='lib'; }).sort(function(a,b){ return a.o.l.localeCompare(b.o.l)||a.o.c-b.o.c; });
  h+='<h2>Liberadas para inserir em '+mesNome(F.mes)+' · '+LL.length+' obra(s)</h2>';
  if(LL.length){ h+='<table><thead><tr><th>Obra</th><th>Lote</th><th>Engenheiro</th><th>Medição anterior</th><th>Observação</th></tr></thead><tbody>'+
    LL.map(function(x){ var o=x.o, A=x.lib.ant; return '<tr><td class="obra" data-l="Obra"><b>'+o.c+' — '+esc(o.u)+'</b><span>'+esc(o.cid||'')+(o.ct?' · '+esc(o.ct):'')+'</span></td>'+
      '<td data-l="Lote">L'+esc(o.l)+'</td><td data-l="Engenheiro">'+esc(o.e||'—')+'</td>'+
      '<td data-l="Medição anterior">'+(A?'M'+esc(A[1])+' · '+mesCurto(A[0])+' · aprovada'+(A[3]?' '+esc(A[3]):''):'1ª medição da obra')+'</td>'+
      '<td data-l="Observação">'+(x.o.s&&!/^4/.test(x.o.s)?esc(x.o.s):'')+'</td></tr>'; }).join('')+'</tbody></table>'; }
  else h+='<p class="mini">Nenhuma obra liberada com esse filtro.</p>';
  var LF=L.filter(function(x){ return x.lib.st==='falta'; });
  if(LF.length) h+='<p class="mini" style="color:var(--warn);margin-top:6px">'+LF.length+' obra(s) com a última medição aprovada antes de '+mesCurto(mesAnt(F.mes))+' e sem a de '+mesCurto(mesAnt(F.mes))+' no CTR — precisam inserir '+mesCurto(mesAnt(F.mes))+' primeiro: '+
    LF.map(function(x){ return x.o.c; }).join(', ')+'.</p>';
  h+='<p class="sync" id="sync"></p>';
  var por={}; L.forEach(function(x){ (por[x.o.e||'Sem engenheiro']=por[x.o.e||'Sem engenheiro']||[]).push(x); });
  Object.keys(por).sort().forEach(function(e){
    var g=por[e];
    h+='<h2>'+esc(e)+' · '+g.filter(function(x){return x.ok;}).length+' de '+g.length+' completas</h2><table><thead><tr>'+
      '<th>Obra</th><th>Liberada p/ inserir</th><th>Medição</th><th>Situação</th><th>Inserida no portal</th><th>Enviada por e-mail</th><th>RF gerado</th><th>RF enviado</th><th>Observação</th></tr></thead><tbody>';
    g.forEach(function(x){ var o=x.o, m=x.m, q=quem(x.k,['portal','email','rfenv','rfwa','rfem','obs']);
      h+='<tr class="'+(x.ok?'okrow':'')+'">'+
        '<td class="obra" data-l="Obra"><b>'+o.c+' — '+esc(o.u)+'</b><span>L'+esc(o.l)+(o.cid?' · '+esc(o.cid):'')+(o.ct?' · '+esc(o.ct):'')+'</span></td>'+
        '<td data-l="Liberada p/ inserir">'+libCel(x.lib)+'</td>'+
        '<td data-l="Medição">'+(m?'<b>M'+esc(m.n)+'</b><div class="mini">ref. '+mesNome(F.mes)+'</div>':'—')+'</td>'+
        '<td data-l="Situação">'+sitPill(m)+(m&&m.dp?'<div class="mini">desde '+dbr(m.dp)+'</div>':'')+(m&&m.ap&&/^4/.test(m.sit)?'<div class="mini">aprovada '+esc(m.ap.slice(0,10))+'</div>':'')+'</td>'+
        '<td data-l="Inserida no portal">'+(x.auto?'<span class="pill p-ok">✓ no portal</span><div class="auto">pela varredura</div>':
          '<button class="tg'+(x.ins?' on':'')+'" data-k="'+x.k+'" data-c="portal">'+(x.ins?'✓ inserida':'marcar inserida')+'</button>')+'</td>'+
        '<td data-l="Enviada por e-mail"><button class="tg'+(x.em?' on':'')+'" data-k="'+x.k+'" data-c="email">'+(x.em?'✓ enviada':'marcar enviada')+'</button></td>'+
        '<td data-l="RF gerado">'+(x.rfg?'<span class="pill p-ok" title="'+esc(x.rf)+'">✓ na pasta</span>':'<span class="pill p-na">não achado</span>')+'</td>'+
        '<td data-l="RF enviado"><div class="rfb"><button class="tg'+(x.rfwa?' on':'')+'" data-k="'+x.k+'" data-c="rfwa">'+(x.rfwa?'✓ WhatsApp':'WhatsApp')+'</button>'+
          '<button class="tg'+(x.rfem?' on':'')+'" data-k="'+x.k+'" data-c="rfem">'+(x.rfem?'✓ e-mail':'e-mail')+'</button></div>'+
          (x.rfant?'<div class="mini">✓ enviado (sem meio)</div>':'')+'</td>'+
        '<td data-l="Observação"><input class="obs" id="o_'+x.k.replace('|','_')+'" data-k="'+x.k+'" value="'+esc(x.obs)+'" placeholder="ex.: aguardando fiscal">'+
          (q?'<div class="mini">'+esc(q.por)+' · '+esc(q.quando)+'</div>':'')+'</td></tr>';
    });
    h+='</tbody></table>';
  });
  if(!L.length) h+='<p class="mini" style="margin-top:14px">Nenhuma obra com esse filtro.</p>';
  h+='<p class="mini" style="margin-top:16px">Situação e “inserida no portal” vêm da varredura do portal (CTR) · “RF gerado” é o arquivo RF … '+F.mes.split('-')[1]+'-'+F.mes.split('-')[0]+' na pasta da obra · dados de '+esc(D.ger)+'. '+
     'E-mail e RF enviado (WhatsApp ou e-mail) ficam salvos para todos os aparelhos. '+
     '<b>Liberada para inserir</b>: a medição do mês anterior ao escolhido está aprovada no portal (ou é a 1ª medição da obra); <b>travada</b>: a anterior ainda está em análise/edição; <b>falta</b>: a obra não tem a medição do mês anterior — inserir aquela primeiro.</p>';
  app.innerHTML=h; pintaSync();
  if(foco){ var f=document.getElementById(foco); if(f){ f.focus(); if(f.setSelectionRange&&f.value) f.setSelectionRange(f.value.length,f.value.length); } }
  window.scrollTo(0,y);
}
app.addEventListener('click',function(e){ var t=e.target.closest('.tg'); if(!t) return;
  var k=t.dataset.k, c=t.dataset.c, cur=val(k,c), on=cur===true||cur==='1';
  if(marca(k,c,!on)) render(); });
app.addEventListener('change',function(e){ var t=e.target;
  if(t.id==='fMes'){ F.mes=t.value; ls('chkMes',F.mes); render(); }
  else if(t.id==='fEng'){ F.eng=t.value; ls('chkEng',F.eng); render(); }
  else if(t.id==='fLote'){ F.lote=t.value; render(); }
  else if(t.id==='fPend'){ F.pend=t.checked; ls('chkPend',F.pend?'1':'0'); render(); }
  else if(t.id==='fLib'){ F.lib=t.checked; ls('chkLib',F.lib?'1':'0'); render(); }
  else if(t.classList.contains('obs')){ if(t.value!==(val(t.dataset.k,'obs')||'')&&marca(t.dataset.k,'obs',t.value)) render(); }
});
app.addEventListener('input',function(e){ var t=e.target;
  if(t.id==='fQuem'){ ls(QCH,t.value); t.style.borderColor=''; }
  else if(t.id==='fBusca'){ F.busca=t.value; clearTimeout(render._t); render._t=setTimeout(render,250); }
});
/* 08/10: contexto vindo do painel. A pagina agora abre dentro de uma aba do
   painel (iframe da mesma origem), entao ela nasce ja com o recorte que estava
   na tela -- engenheiro, lote, obra, mes -- em vez de voltar para as 330. */
(function(){ var P=new URLSearchParams(location.search);
  if(P.get('obra')){ F.obra=P.get('obra'); F.pend=false; F.lib=false; }
  if(P.get('eng')) F.eng=P.get('eng');
  if(P.get('lote')) F.lote=P.get('lote');
  if(P.get('q')) F.busca=P.get('q');
  if(P.get('mes')&&D.meses.indexOf(P.get('mes'))>=0) F.mes=P.get('mes');
})();
render(); puxa().then(envia);
setInterval(function(){ if(document.visibilityState==='visible'&&!fila().length) puxa(); },60000);
})();
