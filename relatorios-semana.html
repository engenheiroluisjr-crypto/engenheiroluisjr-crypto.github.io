<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3ef">
<script>
/* segue o tema escolhido no painel (chave painelTema), como as outras paginas */
(function(){var t;try{t=localStorage.getItem('painelTema');}catch(e){}
 if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}
 document.documentElement.setAttribute('data-tema',t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute('content',t==='claro'?'#f4f3ef':'#161615');})();
</script>
<title>Relatórios da semana — Obras FDE</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#dcdad3;--pri:#c2501f;--priBar:#c2501f;--ok:#2f6f4e;--okb:#e6f4ec;--bad:#b3261e;--badb:#fbe0de;--warn:#9a6b00;--warnb:#fdf4de;--na:#6b6b66;--nab:#eeede8}
@media (prefers-color-scheme:dark){html:not([data-tema]){--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#e8825a;--priBar:#a6431a;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420;--na:#a3a29c;--nab:#2c2b28}}
html[data-tema="escuro"]{--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#e8825a;--priBar:#a6431a;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420;--na:#a3a29c;--nab:#2c2b28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--priBar);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;flex:1;min-width:200px}
header.top a{color:#fff;font-size:13px;opacity:.85}
main{max-width:1280px;margin:0 auto;padding:12px 16px 60px}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;min-height:34px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}
.sync{font-size:12.5px;color:var(--mut);margin:4px 0}.sync.ok{color:var(--ok)}.sync.err{color:var(--bad)}
h2{font-size:14px;margin:18px 0 6px;color:var(--pri);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2 .cnt{font-size:12px;color:var(--mut);font-weight:500}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);background:var(--nab)}
td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
tr.okrow td{background:color-mix(in srgb,var(--okb) 45%,transparent)}
tr.just td{opacity:.6}
.obra b{display:block}.obra span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-bad{background:var(--badb);color:var(--bad)}.p-warn{background:var(--warnb);color:var(--warn)}.p-na{background:var(--nab);color:var(--na)}
.tg{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.tg.on{background:var(--warnb);border-color:var(--warn);color:var(--warn);font-weight:650}
.tg.pri{background:var(--priBar);border-color:var(--priBar);color:#fff}
.mini{font-size:11.5px;color:var(--mut);margin-top:2px}
.rel a{color:var(--tx)}
.rel div{margin-top:3px}
.obs{width:100%;min-width:140px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 6px;border-radius:8px;background:var(--nab);color:var(--mut);margin-left:4px;font-weight:600}
.leg{font-size:12px;color:var(--mut);margin:12px 0 0}
#copiado{font-size:12.5px;color:var(--ok)}
@media (max-width:760px){
  thead{display:none} table,tbody,tr,td{display:block;width:100%} tr{border-bottom:2px solid var(--ln);padding:6px 0}
  td{border:0;padding:4px 10px} td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
}
</style>
</head>
<body>
<header class="top"><h1>Relatórios da semana — acompanhamento (RAO) e segurança (SST)</h1><a href="./">← voltar ao painel</a></header>
<main id="app"><p>Carregando…</p></main>
<script src="chk.js"></script>
<script src="rao.js"></script>
<script src="seg.js"></script>
<script src="relsem.js"></script>
<script src="entregas.js"></script>
<script>
(function(){
'use strict';
/* 07/10/2026 — checklist semanal: toda obra em 4. EXECUCAO precisa ter, na semana (seg a dom),
   pelo menos 1 relatorio de acompanhamento de obra (RAO diario, formulario visita.html) e
   1 relatorio de seguranca do trabalho (SST, formulario sst.html).
   Obras: chk.js (situacao do CTR). Relatorios: rao.js e seg.js, refeitos a cada rodada do painel.
   Marcacao "obra parada / sem atividade" e observacao por obra e semana vao para o servidor comum
   do painel como JSON {tipo:'rel', k:'obra|AAAA-MM-DD(segunda)', campo:'st'|'obs', v, por, quando}. */
var C=window.CHK, R=(window.RAO||{}).obras||{}, S=(window.SEG||{}).obras||{}, RS=(window.RELSEM||{}).semanas||[];
var SRV=window.ENTREGAS_SRV||{}, QCH='fdeEntregasQuem', FCH='relFila';
var app=document.getElementById('app');
if(!C||!C.obras){ app.innerHTML='<p>Os dados (chk.js) não carregaram. Atualize a página.</p>'; return; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function agora(){ var d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function ts(q){ var m=/^(\d{2})\/(\d{2})\/(\d{4})[ ,]+(\d{2}):(\d{2})/.exec(q||''); return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).getTime():0; }
function pad(n){ return (n<10?'0':'')+n; }
function isoD(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function br(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'/'+m[2]:''; }
function parseIso(s){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function segunda(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function semIso(d){ var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); var dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/86400000+1)/7); }
function dias(s){ var d=parseIso(s); if(!d) return null; var h=new Date(); h=new Date(h.getFullYear(),h.getMonth(),h.getDate()); return Math.round((h-d)/86400000); }
var ENG={leon:'ENG. Leonardo Montanheri',doug:'ENG. Douglas Anastácio',luis:'ENG. Luis Junior'};
function engN(e){ var x=String(e||'').trim().toLowerCase(); for(var k in ENG) if(x.indexOf(k)===0) return ENG[k]; return e?String(e).trim():'sem engenheiro'; }
function clim(c){ return c>=239&&c<=265; }

/* semanas: a atual e as 7 anteriores */
var HOJE=new Date(), SEMS=[];
(function(){ var m=segunda(HOJE); for(var i=0;i<8;i++){ var a=new Date(m); a.setDate(a.getDate()-7*i); var f=new Date(a); f.setDate(f.getDate()+6);
  SEMS.push({k:isoD(a), de:isoD(a), ate:isoD(f), s:'S'+semIso(a), atual:i===0}); } })();

var OBRAS=C.obras.filter(function(o){ return /^4\./.test(String(o.s||'')); }).map(function(o){
  return {c:o.c, u:o.u, l:o.l, cid:o.cid||'', e:engN(o.e), clim:clim(o.c)}; }).sort(function(a,b){ return a.c-b.c; });

function raos(c){ return (R[String(c)]||[]).filter(function(x){ return x.t==='diario'&&x.d; }); }
function ssts(c){ return (S[String(c)]||[]).filter(function(x){ return x.dk; }); }
function naSemana(l,campo,w){ return l.filter(function(x){ return x[campo]>=w.de&&x[campo]<=w.ate; }).sort(function(a,b){ return a[campo]<b[campo]?-1:1; }); }
function ultimo(l,campo){ var u=null; l.forEach(function(x){ if(!u||x[campo]>u[campo]) u=x; }); return u; }
function linkRao(c,x){ var a=String(x.a||''); return 'rao/'+c+'/'+(x.pdf?a.replace(/\.html$/,'.pdf'):a); }
function nomeInsp(x){ var s=String(x.insp||'').split('—')[0].trim(); return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }

var F={sem:SEMS[0].k, lote:ls('relLote')||'', eng:ls('relEng')||'', mostra:ls('relMostra')||'falta', clim:ls('relClim')!=='0', busca:''};
var M={}, SY={st:'carregando',hora:''};

/* ---- servidor comum (mesmo das entregas / checklist de materiais) ---- */
function csv(t){ var L=[], r=[], f='', q=false; for(var i=0;i<t.length;i++){ var ch=t[i];
  if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
  else if(ch==='"') q=true; else if(ch===','){ r.push(f); f=''; }
  else if(ch==='\n'){ r.push(f); L.push(r); r=[]; f=''; } else if(ch!=='\r') f+=ch; }
  if(f||r.length){ r.push(f); L.push(r); } return L; }
function fila(){ try{ return JSON.parse(ls(FCH)||'[]'); }catch(e){ return []; } }
function aplica(m){ var id=m.k+'|'+m.campo, a=M[id]; if(!a||ts(m.quando)>=ts(a.quando)) M[id]={v:m.v,por:m.por||'',quando:m.quando||''}; }
function puxa(){
  if(!SRV.ler){ SY.st='local'; fila().forEach(aplica); render(); return Promise.resolve(); }
  return fetch(SRV.ler+'&t='+Date.now()).then(function(r){ return r.text(); }).then(function(t){
    if(/<html/i.test(t.slice(0,200))) throw new Error('privada');
    M={}; csv(t).slice(1).forEach(function(l){ var m; try{ m=JSON.parse(l[1]); }catch(e){ return; } if(m&&m.tipo==='rel'&&m.k&&m.campo) aplica(m); });
    var l=fila().filter(function(x){ var a=M[x.k+'|'+x.campo]; return !(a&&a.quando===x.quando&&String(a.v)===String(x.v)); });
    ls(FCH,JSON.stringify(l)); l.forEach(aplica);
    SY.st=l.length?'pend':'ok'; SY.hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); render();
  }).catch(function(){ fila().forEach(aplica); SY.st='erro'; render(); });
}
function envia(){ var l=fila(); if(!SRV.form||!l.length) return;
  Promise.all(l.map(function(m){ var fd=new FormData(); fd.append(SRV.entry,JSON.stringify(m)); return fetch(SRV.form,{method:'POST',mode:'no-cors',body:fd}); }))
   .then(function(){ setTimeout(puxa,2500); }).catch(function(){ SY.st='erro'; pintaSync(); }); }
function marca(k,campo,v){
  var q=(ls(QCH)||'').trim(); if(!q){ var e=document.getElementById('fQuem'); if(e){ e.focus(); e.style.borderColor='var(--bad)'; e.placeholder='digite seu nome para marcar'; } return false; }
  var m={tipo:'rel',k:k,campo:campo,v:v,por:q,quando:agora()};
  var l=fila().filter(function(x){ return !(x.k===k&&x.campo===campo); }); l.push(m); ls(FCH,JSON.stringify(l));
  aplica(m); SY.st='pend'; clearTimeout(marca._t); marca._t=setTimeout(envia,700); return true; }
function val(k,c){ var a=M[k+'|'+c]; return a?a.v:null; }
function quem(k){ var b=null; ['st','obs'].forEach(function(c){ var a=M[k+'|'+c]; if(a&&a.v&&(!b||ts(a.quando)>ts(b.quando))) b=a; }); return b; }
function pintaSync(){ var e=document.getElementById('sync'); if(!e) return;
  var n=fila().length; e.className='sync '+(SY.st==='ok'?'ok':SY.st==='erro'?'err':'');
  e.textContent=SY.st==='ok'?('✓ marcações salvas para todos · '+SY.hora):SY.st==='erro'?('⚠ sem conexão com o servidor — '+n+' marcação(ões) guardada(s) neste aparelho'):SY.st==='local'?'⚠ servidor não configurado — marcação só neste aparelho':(n?'salvando… ('+n+')':'carregando…'); }

/* ---- calculo ---- */
function semana(){ for(var i=0;i<SEMS.length;i++) if(SEMS[i].k===F.sem) return SEMS[i]; return SEMS[0]; }
function situ(o,w){
  var rr=naSemana(raos(o.c),'d',w), ss=naSemana(ssts(o.c),'dk',w), k=o.c+'|'+w.k, par=val(k,'st')==='parada';
  return {o:o, k:k, rao:rr, sst:ss, par:par, ok:rr.length>0&&ss.length>0, ur:ultimo(raos(o.c),'d'), us:ultimo(ssts(o.c),'dk')};
}
function filtra(){ return OBRAS.filter(function(o){
  return (!F.lote||String(o.l)===F.lote)&&(!F.eng||o.e===F.eng)&&(F.clim||!o.clim)&&
    (!F.busca||(o.c+' '+o.u+' '+o.cid).toLowerCase().indexOf(F.busca.toLowerCase())>=0); }); }
function pillFalta(w){ return w.atual?'<span class="pill p-warn">pendente</span>':'<span class="pill p-bad">não feito</span>'; }
function celRel(lst,tipo,o,w,par){
  if(lst.length) return '<div class="rel">'+lst.map(function(x){
    return tipo==='rao'
      ? '<div><span class="pill p-ok">✓ '+br(x.d)+'</span> <a href="'+esc(linkRao(o.c,x))+'" target="_blank" rel="noopener">RAO nº '+(x.n||'—')+'</a><div class="mini">'+esc(x.q||'')+'</div></div>'
      : '<div><span class="pill p-ok">✓ '+br(x.dk)+'</span> <a href="'+esc(x.pdf||'')+'" target="_blank" rel="noopener">SST</a>'+(x.cls?' <span class="tag">'+esc(x.cls)+'</span>':'')+'<div class="mini">'+esc(nomeInsp(x))+'</div></div>';
  }).join('')+'</div>';
  if(par) return '<span class="pill p-na">obra parada</span>';
  return pillFalta(w)+'<div class="mini"><a href="'+(tipo==='rao'?'visita.html':'sst.html')+'?obra='+o.c+'" target="_blank" rel="noopener">preencher agora ↗</a></div>';
}
function celUlt(x,campo){ if(!x) return '<span class="mini">nunca</span>'; var d=dias(x[campo]); return br(x[campo])+'<div class="mini">há '+d+' dia'+(d===1?'':'s')+'</div>'; }

function resumoTexto(L,w){
  var g={}; L.forEach(function(s){ if(s.ok||s.par) return; (g[s.o.e]=g[s.o.e]||{r:[],s:[]});
    if(!s.rao.length) g[s.o.e].r.push(s.o.l+'.'+s.o.c+' '+s.o.u); if(!s.sst.length) g[s.o.e].s.push(s.o.l+'.'+s.o.c+' '+s.o.u); });
  var t='*Relatórios da semana '+w.s+' ('+br(w.de)+' a '+br(w.ate)+')* — obras sem relatório\n';
  Object.keys(g).sort().forEach(function(e){ t+='\n*'+e+'*\n';
    if(g[e].r.length) t+='Falta acompanhamento de obra (RAO):\n'+g[e].r.map(function(x){ return '• '+x; }).join('\n')+'\n';
    if(g[e].s.length) t+='Falta segurança do trabalho (SST):\n'+g[e].s.map(function(x){ return '• '+x; }).join('\n')+'\n'; });
  if(!Object.keys(g).length) t+='\nTodas as obras filtradas têm RAO e SST na semana.';
  return t;
}

function render(){
  var y=window.scrollY, foco=document.activeElement&&document.activeElement.id;
  var w=semana(), OB=filtra(), L=OB.map(function(o){ return situ(o,w); });
  var engs={}; OBRAS.forEach(function(o){ engs[o.e]=1; });
  var nR=L.filter(function(s){ return s.rao.length; }).length, nS=L.filter(function(s){ return s.sst.length; }).length,
      nOk=L.filter(function(s){ return s.ok; }).length, nP=L.filter(function(s){ return !s.ok&&s.par; }).length, nF=L.length-nOk-nP;
  var rs=null; RS.forEach(function(x){ if(x.k===w.k) rs=x; });
  var h='<div class="barra">'+
    '<label class="f">Semana<select id="fSem">'+SEMS.map(function(s){ return '<option value="'+s.k+'"'+(s.k===F.sem?' selected':'')+'>'+s.s+' · '+br(s.de)+' a '+br(s.ate)+(s.atual?' (atual)':'')+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">Lote<select id="fLote"><option value="">41 e 42</option><option'+(F.lote==='41'?' selected':'')+'>41</option><option'+(F.lote==='42'?' selected':'')+'>42</option></select></label>'+
    '<label class="f">Engenheiro<select id="fEng"><option value="">todos</option>'+Object.keys(engs).sort().map(function(e){ return '<option'+(e===F.eng?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">Mostrar<select id="fMostra"><option value="falta"'+(F.mostra==='falta'?' selected':'')+'>só obras com falta</option><option value="todas"'+(F.mostra==='todas'?' selected':'')+'>todas as obras</option><option value="ok"'+(F.mostra==='ok'?' selected':'')+'>só as completas</option></select></label>'+
    '<label class="f">Buscar<input id="fBusca" value="'+esc(F.busca)+'" placeholder="nº, escola ou cidade"></label>'+
    '<label class="chk"><input type="checkbox" id="fClim"'+(F.clim?' checked':'')+'> incluir climatização</label>'+
    '<label class="f" style="margin-left:auto">Marcando como<input id="fQuem" value="'+esc(ls(QCH)||'')+'" placeholder="seu nome"></label></div>';
  h+='<div class="kpi"><div><b>'+L.length+'</b><span>obras em execução</span></div>'+
     '<div><b style="color:var(--ok)">'+nOk+'</b><span>completas (RAO + SST)</span></div>'+
     '<div><b>'+nR+'</b><span>com RAO na semana</span></div><div><b>'+nS+'</b><span>com SST na semana</span></div>'+
     '<div><b style="color:var(--bad)">'+nF+'</b><span>faltando relatório</span></div>'+
     (nP?'<div><b>'+nP+'</b><span>marcadas “obra parada”</span></div>':'')+'</div>';
  h+='<div class="btns"><button class="tg pri" id="btCopia">Copiar resumo do que falta (por engenheiro)</button>'+
     (rs&&rs.a?'<a class="tg" href="'+esc(rs.a)+'" target="_blank" rel="noopener">Semanal de todas as obras '+esc(rs.s||w.s)+' (PDF) ↗</a>':'')+
     '<span id="copiado"></span></div><p class="sync" id="sync"></p>';
  var grp={}; L.forEach(function(s){
    if(F.mostra==='falta'&&(s.ok||s.par)) return; if(F.mostra==='ok'&&!s.ok) return;
    (grp[s.o.e]=grp[s.o.e]||[]).push(s); });
  var ks=Object.keys(grp).sort();
  if(!ks.length) h+='<p style="margin-top:14px">'+(F.mostra==='falta'?'✓ Todas as obras filtradas têm RAO e SST nesta semana.':'Nenhuma obra com esse filtro.')+'</p>';
  ks.forEach(function(e){
    var G=grp[e], tot=L.filter(function(s){ return s.o.e===e; }), ok=tot.filter(function(s){ return s.ok; }).length;
    h+='<h2>'+esc(e)+' <span class="cnt">'+ok+' de '+tot.length+' obras completas na semana</span></h2>';
    h+='<table><thead><tr><th>Obra</th><th>Acompanhamento (RAO)</th><th>Segurança (SST)</th><th>Último RAO</th><th>Última SST</th><th>Marcar</th><th>Observação</th></tr></thead><tbody>';
    G.forEach(function(s){ var o=s.o, k=s.k, q=quem(k);
      h+='<tr class="'+(s.ok?'okrow':s.par?'just':'')+'"><td class="obra" data-l="Obra"><b>'+o.l+'.'+o.c+' — '+esc(o.u)+'</b><span>'+esc(o.cid)+(o.clim?' <span class="tag">climatização</span>':'')+'</span></td>'+
        '<td data-l="Acompanhamento (RAO)">'+celRel(s.rao,'rao',o,w,s.par)+'</td>'+

        '<td data-l="Marcar"><button class="tg'+(s.par?' on':'')+'" data-k="'+k+'">'+(s.par?'✓ obra parada':'obra parada')+'</button></td>'+
        '<td data-l="Observação"><input class="obs" id="o_'+k.replace(/[|.\-]/g,'_')+'" data-k="'+k+'" value="'+esc(val(k,'obs')||'')+'" placeholder="ex.: visita marcada quinta">'+
        (q?'<div class="mini">'+esc(q.por)+' · '+esc(q.quando)+'</div>':'')+'</td></tr>';

    h+='</tbody></table>';
  });
  h+='<p class="leg">Regra: toda obra em 4. EXECUÇÃO precisa de pelo menos 1 relatório de acompanhamento de obra (RAO) e 1 vistoria de segurança do trabalho (SST) por semana, de segunda a domingo. '+
     'Na semana atual, o que falta aparece como “pendente”. Nas semanas anteriores, aparece como “não feito”. '+
     '“Obra parada” vale só para a semana marcada e tira a obra da cobrança. Relatórios contados: RAO diário (o semanal não conta) e SST do formulário ou do fiscal. '+
     'Dados das rodadas do painel: RAO '+esc((window.RAO||{}).ger||'')+' · SST '+esc((window.SEG||{}).ger||'')+' · obras do CTR '+esc(C.ger||'')+'.</p>';
  app.innerHTML=h; pintaSync();
  if(foco){ var f=document.getElementById(foco); if(f){ f.focus(); if(f.setSelectionRange&&f.value) f.setSelectionRange(f.value.length,f.value.length); } }
  window.scrollTo(0,y);
  render._L=L; render._w=w;
}
function copia(t){
  function ok(){ var e=document.getElementById('copiado'); if(e){ e.textContent='✓ copiado — é só colar no WhatsApp'; setTimeout(function(){ e.textContent=''; },4000); } }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok,function(){ velho(); }); } else velho();
  function velho(){ var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); ok(); }catch(e){} a.remove(); }
}
app.addEventListener('click',function(e){
  if(e.target.id==='btCopia'){ e.preventDefault(); copia(resumoTexto(render._L||[],render._w||semana())); return; }
  var t=e.target.closest('button.tg[data-k]'); if(!t) return; e.preventDefault();
  var k=t.dataset.k, cur=val(k,'st'); if(marca(k,'st',cur==='parada'?'':'parada')) render(); });

  else if(t.classList.contains('obs')){ if(t.value!==(val(t.dataset.k,'obs')||'')&&marca(t.dataset.k,'obs',t.value)) render(); }
});
app.addEventListener('input',function(e){ var t=e.target;
  if(t.id==='fQuem'){ ls(QCH,t.value); t.style.borderColor=''; }
  else if(t.id==='fBusca'){ F.busca=t.value; clearTimeout(render._t); render._t=setTimeout(render,250); }
});

render(); puxa().then(envia);
