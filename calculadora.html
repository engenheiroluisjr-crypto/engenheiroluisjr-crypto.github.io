<script>
(function(){
/* ===========================================================================
   Calculadora de materiais FDE — 08/10/2026

   De onde vem o numero. Cada servico do boletim FDE tem uma composicao: quanto
   de cada insumo entra em UMA unidade do servico. Esse coeficiente esta nos
   orcamentos das obras (publicar/orc/<obra>.json, bloco "comp") e o
   gera_comp_js.py junta os 99 num banco so — 837 servicos. Conferido em
   08/10/2026: ZERO divergencia de coeficiente entre obras, porque o coeficiente
   e da FDE e nao da obra.

   Entao 5 m de muro FD-16 nao e estimativa: e 5 x o coeficiente da propria FDE.

   O preco. A FDE publica o preco do SERVICO e os coeficientes, nunca o preco do
   insumo — o que aparece aqui como "preco-limite" e um teto, com o grau de
   certeza na coluna Base, a mesma regra da aba Composicoes do painel. E o preco
   do servico varia entre obras (boletins de datas diferentes): 440 dos 839
   servicos tem mais de um preco nos orcamentos publicados. Por isso o resultado
   principal desta pagina e QUANTIDADE, e o valor vem depois, rotulado como teto.
=========================================================================== */
var D=window.COMPFDE||{s:{},c:{}};
var S=D.s||{}, C=D.c||{};
var CH='calcFdeProjeto';

function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nm(v,d){ return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }
function brl(v){ return 'R$ '+nm(v,2); }
function grupo(c){ var g=String(c).split('.')[0];
  return g==='1'?'mo':(g==='8'||g==='9'?'eq':'mat'); }
var GRUPO={mat:'Material',mo:'Mão de obra',eq:'Equipamento'};

/* unidades que so fazem sentido inteiras: quem pede 28,6 blocos pede 29 */
var INTEIRO={UN:1,CJ:1,PC:1,PÇ:1,BR:1,JG:1,MI:1};
function pedido(q,un){ return INTEIRO[String(un).toUpperCase()]?Math.ceil(q-1e-9):q; }
/* ajudas praticas de pedido, sem inventar: so converte unidade */
function extra(ins,q,un){
  var n=String(ins).toUpperCase(), u=String(un).toUpperCase();
  if(u==='KG'&&/\bCIMENTO\b/.test(n)&&!/CRISTALIZANTE|COLA|BRANCO/.test(n))
    return nm(Math.ceil(q/50),0)+' saco(s) de 50 kg';
  if(u==='KG'&&/CAL HIDRATADA/.test(n)) return nm(Math.ceil(q/20),0)+' saco(s) de 20 kg';
  return '';
}

/* ---- projetos padrao da FDE que ja tem composicao no banco ---------------
   Nao ha regra de desenho escrita aqui: a propria composicao da FDE ja traz,
   por metro ou por m2, o aco, o concreto da broca, os blocos e a massa. O que
   a tela faz e multiplicar — e, nos padroes medidos em M2, multiplicar
   comprimento por altura antes. */
var PADROES=[
  {c:'16.01.016', n:'Muro FD-16 · divisa em bloco de concreto, chapisco fino, H=235 cm, com broca'},
  {c:'16.01.029', n:'Muro FD-24 · divisa com gradil eletrofundido, H=235 cm, com broca'},
  {c:'16.04.019', n:'FQ-01 · fechamento de quadra, fundo, com broca'},
  {c:'16.04.031', n:'FQ-01 · fechamento de quadra, laterais, com broca'},
  {c:'16.04.034', n:'FQ-02 · alambrado sobre divisa'},
  {c:'16.01.090', n:'FE-01 · setorização em alambrado, 120 < H < 200 cm'},
  {c:'16.01.091', n:'FE-02 · setorização em gradil eletrofundido'},
  {c:'06.03.032', n:'GR-01 · grade de proteção, ferro chato 1"×1/4", malha 15×15 cm'},
  {c:'06.03.035', n:'GR-02 · grade de proteção / guichê (122×105 cm)'},
  {c:'16.06.023', n:'AL-01 · abrigo para lixo'}
].filter(function(p){ return S[p.c]&&C[p.c]; });

/* ===========================================================================
   PEÇAS E FICHA TÉCNICA — lido dos desenhos do Catálogo de Componentes da FDE
   (00. CATALOGOS TECNICOS FDE/07 - Componentes), em 08/10/2026.

   Regra que eu mesmo me impus aqui: só entra CONTAGEM onde o desenho e a
   composição do boletim FECHAM entre si. Onde não fecham, entra só a ficha
   técnica — o que o catálogo diz, com as palavras dele. Número de obra pública
   derivado de leitura de desenho sem conferência vira glosa.

   FD-16 — fecha. Desenho FD16_20_03_19 rev.7: pilaretes 14x14 a 253cm EIXO A
   EIXO (MÁX.), broca ø25 com 3,00m mínimo, viga baldrame 25x20 corrida.
   Conferência contra a composição (0,13715 m³/m de FCK 25):
       baldrame 0,25x0,20 ......................... 0,05000
       broca ø25 x 3,00m, 1 a cada 2,53m .......... 0,05821
       pilarete 14x14 x 2,35m, 1 a cada 2,53m ..... 0,01821
       soma ....................................... 0,12641
       falta para a composição .................... 0,01074
   e o Det.01 dá a cimalha em 0,23 x 0,05 = 0,0115 m². Fecha.

   FD-24 — NÃO fecha, e por isso não tem contagem aqui. A composição do boletim
   (16.01.029) traz 0,07412 m³/m de FCK 25, mas só o baldrame 25x20 (0,05) mais
   a broca ø25 x 2,50m a cada 2,17m (0,05655) já dão 0,10655. E os montantes:
   o desenho diz 217cm entre eles (0,4608/m), a composição traz 0,667/m. Os dois
   números do próprio FDE discordam — então aqui eu não escolho um.

   Os demais são medidos em m² de painel pronto: a contagem de peças já está na
   composição (montante, painel, tela) e aparece na tabela de material.
=========================================================================== */
var FICHA={
 '16.01.016':{t:'FD-16 · muro de divisa em bloco, h=235cm',
   l:['Pilarete de concreto 14×14 cm, a cada <b>253 cm eixo a eixo (máximo)</b>',
      'Armação do pilarete: 4 × ø12,5 mm, estribos ø5 mm a cada 12 cm',
      'Broca ø25 cm, <b>profundidade mínima 3,00 m</b> quando não indicado em projeto',
      'Armação da broca: 4 × ø12,5 mm, estribos ø4,2 mm a cada 15 cm',
      'Viga baldrame 25 × 20 cm: 4 × ø10 mm corridos, estribos ø5 mm a cada 12 cm',
      'Bloco vazado 14×19×39 cm, classe C, família M-15 · junta de 1 cm desencontrada',
      'Canaleta armada 2 × ø6,3 mm corridos, enchimento em graute',
      'Amarração dos blocos ao pilarete a cada 2 fiadas: ø6,3 mm, C = 80 cm',
      'Alvenaria de embasamento: mínimo 30 cm enterrada',
      'Junta de dilatação de 2 cm <b>a cada 30,00 m no máximo</b>',
      'Assentamento: argamassa 1:0,5:4,5 (cimento, cal, areia) · chapisco fino nas duas faces'],
   f:'FD16_20_03_19 rev.7'},
 '16.01.029':{t:'FD-24 · divisa com gradil eletrofundido, h=235cm',
   l:['Distância entre montantes: <b>217 cm</b> (desenho)',
      'Pilarete de concreto 14×14 cm: 4 × ø12,5 mm, estribos ø5 mm a cada 12 cm',
      'Broca ø25 cm, <b>profundidade 2,50 m</b> quando não indicado em projeto',
      'Viga baldrame 25 × 20 cm: 4 × ø10 mm corridos, estribos ø5 mm a cada 12 cm',
      'Gradil h=171,8 cm · altura total 235 cm (o FD-23 é o mesmo com h total 185 cm)',
      'Alvenaria de embasamento: mínimo 30 cm enterrada',
      'Junta de dilatação de 2 cm a cada 30 m no máximo'],
   f:'FD23_e_FD24_20_03_19 rev.1',
   av:'O desenho e a composição do boletim discordam neste padrão — ver a nota embaixo da tabela.'},
 '16.04.019':{t:'FQ-01 · fechamento de quadra, fundos',
   l:['Pilarete de concreto 14×14 cm: 4 × ø12,5 mm, estribos ø5 mm a cada 12 cm',
      'Fundação em baldrame sobre brocas ou sapatas corridas, conforme o terreno e o projeto',
      'Bloco vazado 14×19×39 cm, 2 furos, fck ≥ 2 MPa · canaleta armada 2 × ø6,3 mm com graute',
      'Amarração dos blocos ao pilarete a cada 2 fiadas: ø6,3 mm, <b>C = 75 cm</b>',
      '<b>Buzinotes de PVC ø2": 4 unidades por mureta</b> dos fundos, desaguando nas canaletas externas',
      'Montantes verticais em tubo de aço galvanizado a fogo ø2" e=2 mm, com tamponamento e grapas',
      'Tela de arame galvanizado fio 10 (3,4 mm), malha quadrada 2"'],
   f:'FQ01_18_09_09'},
 '16.04.031':{t:'FQ-01 · fechamento de quadra, laterais',
   l:['Mesmos constituintes dos fundos, sem os buzinotes',
      'Pilarete de concreto 14×14 cm: 4 × ø12,5 mm, estribos ø5 mm a cada 12 cm',
      'Amarração dos blocos ao pilarete a cada 2 fiadas: ø6,3 mm, C = 75 cm',
      'Montantes em tubo de aço galvanizado a fogo ø2" e=2 mm',
      'Tela de arame galvanizado fio 10, malha quadrada 2"'],
   f:'FQ01_18_09_09'},
 '16.04.034':{t:'FQ-02 · alambrado sobre divisa',
   l:['Montantes ø2" e=2 mm, <b>chumbados 50 cm no mínimo</b> dentro do pilarete de concreto',
      'Mínimo de 2 grapas soldadas por montante',
      'Escoramentos ø1¼" e=2 mm, com barra chata 3/16" — 2 conjuntos de parafuso por escoramento',
      'Travamentos horizontais superior e inferior em ø1¼" e=2 mm',
      'Tela fio 10 (3,4 mm), malha quadrada 2", pontas dobradas (standard)',
      'Amarração da tela com arame galvanizado fio 14: nos montantes de extremidade e nos travamentos, <b>todas as malhas</b>; nos demais, malha sim, malha não',
      'Em muro escalonado: montantes chumbados em bloco preenchido com graute e escoramento a cada desnível',
      'Medido em m² no plano vertical'],
   f:'FQ02_11_09_06'},
 '16.01.090':{t:'FE-01 · setorização em alambrado',
   l:['Base de concreto 20 × 20 cm com <b>broca ø20 cm</b>, bloco 19×19×19 classe A, concreto fck 20 MPa',
      'Ressalto de 5 cm acima do piso, cimento desempenado, caído nas 4 faces',
      'Montantes em tubo industrial galvanizado a fogo ø38,1 mm e=2 mm, mínimo 2 grapas por peça',
      'Requadros da tela em barra chata galvanizada 19,05 × 4,76 mm',
      'Tela fio 10 (3,4 mm), malha quadrada 2"',
      'Medido em m² no plano vertical · altura se especifica em projeto'],
   f:'FE01_24_01_17'},
 '16.01.091':{t:'FE-02 · setorização em gradil eletrofundido',
   l:['Base de concreto 20 × 20 cm com <b>broca ø20 cm</b>, bloco 19×19×19 classe A, concreto fck 20 MPa',
      'Ressalto de 5 cm acima do piso, cimento desempenado, com caimento',
      'Painel em malha retangular 65 × 132 mm: barras chatas portantes 25 × 2 mm e fio ø4,8 mm',
      'Montante vertical em barra chata 76 × 8 mm, <b>chumbado 30 cm no mínimo</b>',

      'Medido em m² no plano vertical · altura e cor se especificam em projeto'],
   f:'FE02_24_01_17'}
};

/* contagem só onde o desenho e a composição fecham — hoje, só o FD-16 */
var PECAS={
 '16.01.016': function(L){
    var e=2.53, vaos=Math.ceil(L/e - 1e-9), pil=vaos+1;
    return {nota:'Pilaretes a 2,53 m <b>no máximo</b> — então esta é a quantidade <b>mínima</b>. '+
             'Canto, portão e escalonamento pedem pilarete próprio e não estão contados aqui.',
            l:[['Vãos entre pilaretes', vaos, '', 'L ÷ 2,53 m, arredondado para cima'],
               ['Pilaretes 14×14 cm', pil, 'un', 'vãos + 1'],
               ['Brocas ø25 cm', pil, 'un', '1 sob cada pilarete'],
               ['Perfuração total', (pil*3).toFixed(2).replace('.',','), 'm', 'brocas × 3,00 m (profundidade mínima)'],
               ['Viga baldrame 25×20', L.toFixed(2).replace('.',','), 'm', 'corrida, em todo o comprimento'],
               ['Cimalha com pingadeira', L.toFixed(2).replace('.',','), 'm', 'idem'],
               ['Juntas de dilatação 2 cm', Math.max(0,Math.ceil(L/30-1e-9)-1), 'un', 'a cada 30,00 m no máximo']]};
 }
};

var P=[];            /* o projeto: [{c:cod, q:quantidade}] */
try{ P=JSON.parse(localStorage.getItem(CH)||'[]')||[]; }catch(e){ P=[]; }
P=P.filter(function(x){ return x&&S[x.c]&&x.q>0; });
function salva(){ try{ localStorage.setItem(CH,JSON.stringify(P)); }catch(e){} }

function junta(cod,q){
  var i=P.findIndex(function(x){ return x.c===cod; });
  if(i>=0) P[i].q=Math.round((P[i].q+q)*1e6)/1e6; else P.push({c:cod,q:q});
  salva(); render();
}

/* ---- insumos somados do projeto inteiro ---- */
function somar(){
  var m={};
  P.forEach(function(it){
    (C[it.c]||[]).forEach(function(x){
      var k=x[0], r=m[k]||(m[k]={cod:k,nome:x[1],un:x[2],q:0,pl:x[4],base:x[5],de:[]});
      var q=x[3]*it.q; r.q+=q;
      r.de.push({c:it.c,q:q});
      /* base mais frouxa manda: o teto do conjunto nao pode ser melhor que o pior pedaco */
      var ordem={exato:0,apertado:1,indicativo:2,frouxo:3};
      if((ordem[x[5]]||0)>(ordem[r.base]||0)) r.base=x[5];
    });
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}

function render(){
  var h='';

  /* ---- 1. projetos padrao ---- */
  h+='<h2>Projetos padrão da FDE <span class="mini">— informe a medida e a composição da própria FDE faz o resto</span></h2>';
  h+='<div class="pads naoImp">'+PADROES.map(function(p){
    var s=S[p.c], un=s[1];
    var campos = un==='M2'
      ? '<label class="f">Comprimento (m)<input type="number" min="0" step="0.01" id="pc_'+p.c+'"></label>'+
        '<label class="f">Altura (m)<input type="number" min="0" step="0.01" id="pa_'+p.c+'"></label>'
      : '<label class="f">'+(un==='M'?'Comprimento (m)':'Quantidade ('+esc(un)+')')+
        '<input type="number" min="0" step="0.01" id="pc_'+p.c+'"></label>';
    return '<div class="pad"><span class="cod">'+esc(p.c)+' · medido em '+esc(un)+' · '+
      (C[p.c]||[]).length+' insumos</span><span class="nm">'+esc(p.n)+'</span>'+
      '<div class="ent">'+campos+'<button class="bt pri" data-pad="'+p.c+'">Somar ao projeto</button></div></div>';
  }).join('')+'</div>';

  /* ---- 2. qualquer servico ---- */
  h+='<h2>Qualquer outro serviço do boletim <span class="mini">— '+Object.keys(C).length+' serviços com composição</span></h2>';
  h+='<div class="card naoImp"><div class="busca">'+
     '<input type="search" id="q" placeholder="código ou nome: piso, argamassa, 04.01.051…" autocomplete="off">'+
     '<label class="f">Quantidade<input type="number" min="0" step="0.01" id="qq"></label>'+
     '</div><div id="sug" class="sug" hidden></div>'+
     '<p class="mini" id="escolhido" style="margin:8px 0 0">Nenhum serviço escolhido.</p></div>';

  /* ---- 3. o projeto ---- */
  h+='<h2>Projeto <span class="mini">— '+(P.length?P.length+' serviço(s)':'vazio')+'</span></h2>';
  if(!P.length){ h+='<div class="vazio">Some um projeto padrão ou escolha um serviço acima. O que você montar fica guardado neste aparelho.</div>'; }
  else{
    h+='<table><thead><tr><th>Código</th><th>Serviço</th><th class="n">Quantidade</th><th>Un</th><th class="naoImp"></th></tr></thead><tbody>'+
      P.map(function(it,i){ var s=S[it.c];
        return '<tr><td class="mono" data-l="Código">'+esc(it.c)+'</td>'+
          '<td data-l="Serviço">'+esc(s[0])+'</td>'+
          '<td class="n" data-l="Quantidade"><input type="number" min="0" step="0.01" value="'+it.q+'" data-q="'+i+'"></td>'+
          '<td data-l="Un">'+esc(s[1])+'</td>'+
          '<td class="naoImp"><button class="bt del" data-rm="'+i+'">remover</button></td></tr>';
      }).join('')+'</tbody></table>';
    h+='<div class="acoes naoImp"><button class="bt" id="limpar">Limpar projeto</button>'+
       '<button class="bt" id="imprimir">Imprimir / PDF</button>'+
       '<button class="bt" id="xls">Baixar em Excel</button></div>';

    /* ---- 3a. peças e ficha técnica dos padrões ---- */
    var comPeca=P.filter(function(it){ return PECAS[it.c]; });
    var comFicha=P.filter(function(it){ return FICHA[it.c]; });
    if(comPeca.length){
      h+='<h2>Peças do projeto <span class="mini">— contagem pelo desenho do Catálogo de Componentes</span></h2>';
      comPeca.forEach(function(it){
        var R=PECAS[it.c](it.q), fi=FICHA[it.c]||{};
        h+='<div class="card" style="margin-bottom:10px"><b>'+esc(fi.t||S[it.c][0])+'</b>'+
           '<span class="mini"> · '+nm(it.q,2)+' '+esc(S[it.c][1])+'</span>'+
           '<table style="margin-top:8px"><thead><tr><th>Peça</th><th class="n">Quantidade</th><th>Un</th><th>Como sai</th></tr></thead><tbody>'+
           R.l.map(function(r){ return '<tr><td data-l="Peça">'+esc(r[0])+'</td><td class="n" data-l="Quantidade"><b>'+r[1]+'</b></td>'+
             '<td data-l="Un">'+esc(r[2])+'</td><td class="mini" data-l="Como sai">'+esc(r[3])+'</td></tr>'; }).join('')+
           '</tbody></table><p class="aviso" style="margin:8px 0 0">'+R.nota+'</p></div>';
      });
    }

    /* ---- 3b. valor do servico, pelo preco dos contratos ----------------------
       Este e o numero que ele usa para orcar. O preco do servico varia entre
       obras (boletins de datas diferentes), entao sai como FAIXA, dizendo em
       quantos orcamentos foi visto. Fica ANTES do material de proposito: o teto
       dos insumos la embaixo e so um limite, nao serve para orcar. */
    var vmin=0, vmax=0, semPreco=0;
    P.forEach(function(it){ var f=S[it.c][2];
      if(f&&f.length===2){ vmin+=f[0]*it.q; vmax+=f[1]*it.q; } else semPreco++; });
    h+='<h2>Valor do serviço <span class="mini">— pelo preço praticado nos orçamentos publicados</span></h2>';
    h+='<table><thead><tr><th>Código</th><th>Serviço</th><th class="n">Quantidade</th>'+
       '<th class="n">Preço unitário</th><th class="n">Valor</th></tr></thead><tbody>'+
      P.map(function(it){ var s2=S[it.c], f=s2[2];
        var pr = (f&&f.length===2)
          ? (f[0]===f[1] ? brl(f[0]) : brl(f[0])+' a '+brl(f[1]))
          : '<span class="mini">sem preço nos orçamentos</span>';
        var vl = (f&&f.length===2)
          ? (f[0]===f[1] ? brl(f[0]*it.q) : brl(f[0]*it.q)+' a '+brl(f[1]*it.q))
          : '—';
        return '<tr><td class="mono" data-l="Código">'+esc(it.c)+'</td>'+
          '<td data-l="Serviço">'+esc(s2[0])+'<div class="mini">visto em '+s2[3]+' orçamento(s)</div></td>'+
          '<td class="n" data-l="Quantidade">'+nm(it.q,2)+' '+esc(s2[1])+'</td>'+
          '<td class="n" data-l="Preço">'+pr+'</td><td class="n" data-l="Valor">'+vl+'</td></tr>';
      }).join('')+
      '<tr class="tot"><td colspan="4">Total'+(semPreco?' (faltam '+semPreco+' sem preço)':'')+'</td>'+
      '<td class="n">'+(vmin===vmax?brl(vmin):brl(vmin)+' a '+brl(vmax))+'</td></tr>'+
      '</tbody></table>';
    h+='<p class="aviso" style="margin-top:8px">Preço do serviço <b>com BDI</b>, como está no orçamento da obra. '+
       'A faixa existe porque obras de boletins diferentes pagam valores diferentes pelo mesmo serviço — '+
       '<b>para orçar, use o preço do contrato da obra</b>, não esta faixa.</p>';

    /* ---- 4. material ---- */
    var L=somar(), tot=0;
    L.forEach(function(r){ tot+=r.pl*r.q; });
    h+='<h2>Material a pedir <span class="mini">— '+L.length+' insumos</span></h2>';
    h+='<table><thead><tr><th>Código</th><th>Insumo</th><th>Un</th>'+
       '<th class="n">Quantidade</th><th class="n">Pedir</th>'+
       '<th class="n">Preço-limite</th><th>Base</th><th class="n">Valor-limite</th></tr></thead><tbody>';
    ['mat','mo','eq'].forEach(function(g){
      var lg=L.filter(function(r){ return grupo(r.cod)===g; })
              .sort(function(a,b){ return (b.pl*b.q)-(a.pl*a.q); });
      if(!lg.length) return;
      var sg=lg.reduce(function(a,r){ return a+r.pl*r.q; },0);
      h+='<tr class="g"><td colspan="8">'+GRUPO[g]+' · '+lg.length+' insumo(s) · teto '+brl(sg)+'</td></tr>';
      lg.forEach(function(r){
        var ex=extra(r.nome,r.q,r.un);
        h+='<tr><td class="mono" data-l="Código">'+esc(r.cod)+'</td>'+
          '<td data-l="Insumo">'+esc(r.nome)+(ex?'<div class="mini">'+esc(ex)+'</div>':'')+'</td>'+
          '<td data-l="Un">'+esc(r.un)+'</td>'+
          '<td class="n" data-l="Quantidade">'+nm(r.q,3)+'</td>'+
          '<td class="n" data-l="Pedir"><b>'+nm(pedido(r.q,r.un), INTEIRO[String(r.un).toUpperCase()]?0:2)+'</b></td>'+
          '<td class="n" data-l="Preço-limite">'+brl(r.pl)+'</td>'+
          '<td data-l="Base"><span class="pill b-'+esc(r.base)+'">'+esc(r.base)+'</span></td>'+
          '<td class="n" data-l="Valor-limite">'+brl(r.pl*r.q)+'</td></tr>';
      });
    });
    h+='<tr class="tot"><td colspan="7">Soma dos tetos — <b>não é orçamento</b>, ver a nota abaixo</td><td class="n">'+brl(tot)+'</td></tr>';
    h+='</tbody></table>';
    h+='<p class="aviso" style="margin-top:10px"><b>O que é teto e o que é exato.</b> '+
       'A <b>quantidade</b> é exata: é o coeficiente da composição da FDE multiplicado pela medida que você digitou. '+
       'O <b>preço-limite</b> não: a FDE publica o preço do serviço e os coeficientes, nunca o preço do insumo — '+
       'o que está aqui é um máximo garantido, e a coluna <b>Base</b> diz o quanto ele é apertado '+
       '(<span class="pill b-exato">exato</span> um insumo só na composição · '+
       '<span class="pill b-apertado">apertado</span> 2 ou 3 · '+
       '<span class="pill b-indicativo">indicativo</span> 4 a 6 · '+
       '<span class="pill b-frouxo">frouxo</span> 7 ou mais). '+
       'Somar os tetos de todos os insumos dá um número bem acima do serviço real, porque cada teto já '+
       'supõe que o serviço inteiro foi gasto naquele insumo. <b>Para orçar, use o quadro «Valor do serviço» acima.</b></p>';
  }

  if(P.filter(function(it){ return FICHA[it.c]; }).length){
    h+='<h2>Ficha técnica dos padrões <span class="mini">— o que o Catálogo de Componentes da FDE exige</span></h2>';
    P.forEach(function(it){ var fi=FICHA[it.c]; if(!fi) return;
      h+='<div class="card" style="margin-bottom:10px"><b>'+esc(fi.t)+'</b>'+
         '<span class="mini"> · prancha '+esc(fi.f)+'</span>'+
         (fi.av?'<p class="aviso" style="margin:6px 0 0;color:var(--warn)"><b>Atenção.</b> '+esc(fi.av)+'</p>':'')+
         '<ul style="margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.65">'+
         fi.l.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></div>';
    });
    if(P.some(function(it){ return it.c==='16.01.029'; })){
      h+='<p class="aviso"><b>A divergência do FD-24, em números.</b> A composição do boletim (16.01.029) traz '+
         '<b>0,07412 m³/m</b> de concreto FCK 25. Só a viga baldrame 25×20 corrida dá 0,05000 m³/m, e a broca '+
         'ø25 de 2,50 m a cada 2,17 m dá mais 0,05655 — <b>0,10655 m³/m só nesses dois</b>, sem contar pilarete. '+
         'E os montantes: o desenho diz 217 cm entre eles (0,461/m), a composição traz 0,667/m. '+
         'São dois números do próprio FDE que não fecham; por isso aqui não há contagem de peças para o FD-24. '+
         'Na dúvida de medição, vale o que estiver no projeto da obra.</p>';
    }
  }
  h+='<p class="aviso" style="margin-top:18px">Banco de composições montado em '+esc(D.ger||'—')+
     ' a partir de '+(D.orcamentos||0)+' orçamentos publicados · '+Object.keys(C).length+
     ' serviços. Coeficiente conferido obra a obra: nenhuma divergência.</p>';

  document.getElementById('app').innerHTML=h;
  liga();
}

/* ---- busca de serviço ---- */
var escolha=null;
function sugere(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var box=document.getElementById('sug');
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  var ter=q.split(/\s+/);
  var L=Object.keys(C).filter(function(c){
    var t=(c+' '+S[c][0]).toLowerCase();
    return ter.every(function(w){ return t.indexOf(w)>=0; });
  }).slice(0,60);
  box.hidden=!L.length;
  box.innerHTML=L.map(function(c){
    return '<button type="button" data-sel="'+c+'"><span class="c">'+esc(c)+'</span>'+
      esc(S[c][0])+'<span class="u">· '+esc(S[c][1])+' · '+(C[c]||[]).length+' insumos</span></button>';
  }).join('');
}

function liga(){
  var app=document.getElementById('app');
  app.onclick=function(ev){
    var t=ev.target.closest('button,[data-rm]'); if(!t) return;
    if(t.dataset.pad){
      var c=t.dataset.pad, un=S[c][1];
      var a=parseFloat((document.getElementById('pc_'+c)||{}).value||'0')||0;
      var b=un==='M2'?(parseFloat((document.getElementById('pa_'+c)||{}).value||'0')||0):1;
      var q=un==='M2'?a*b:a;
      if(!(q>0)){ alert(un==='M2'?'Informe comprimento e altura.':'Informe a medida.'); return; }
      junta(c, Math.round(q*1e6)/1e6); return;
    }
    if(t.dataset.sel){
      escolha=t.dataset.sel;
      document.getElementById('sug').hidden=true;
      document.getElementById('q').value=escolha+' — '+S[escolha][0];
      document.getElementById('escolhido').textContent=
        'Escolhido: '+escolha+' — '+S[escolha][0]+' (medido em '+S[escolha][1]+'). Digite a quantidade e tecle Enter.';
      document.getElementById('qq').focus(); return;
    }
    if(t.dataset.rm!=null){ P.splice(+t.dataset.rm,1); salva(); render(); return; }
    if(t.id==='limpar'){ if(confirm('Apagar o projeto inteiro?')){ P=[]; salva(); render(); } return; }
    if(t.id==='imprimir'){ window.print(); return; }
    if(t.id==='xls'){ excel(); return; }
  };
  var q=document.getElementById('q'); if(q) q.oninput=sugere;
  var qq=document.getElementById('qq');
  if(qq) qq.onkeydown=function(ev){
    if(ev.key!=='Enter') return;
    var v=parseFloat(qq.value||'0')||0;
    if(!escolha){ alert('Escolha um serviço na lista primeiro.'); return; }
    if(!(v>0)){ alert('Digite a quantidade.'); return; }
    junta(escolha, v);
  };
  app.addEventListener('change', function(ev){
    var i=ev.target.dataset&&ev.target.dataset.q; if(i==null) return;
    var v=parseFloat(ev.target.value||'0')||0;
    if(v>0){ P[+i].q=v; } else { P.splice(+i,1); }
    salva(); render();
  });
}

function excel(){
  if(typeof XLSX==='undefined'){ alert('A planilha não carregou — tente de novo com conexão.'); return; }
  var wb=XLSX.utils.book_new();
  var A=[['Código','Serviço','Quantidade','Un']];
  P.forEach(function(it){ A.push([it.c,S[it.c][0],it.q,S[it.c][1]]); });
  var w1=XLSX.utils.aoa_to_sheet(A); w1['!cols']=[{wch:11},{wch:66},{wch:12},{wch:6}];
  XLSX.utils.book_append_sheet(wb,w1,'PROJETO');
  var B=[['Código','Insumo','Un','Quantidade','Pedir','Preço-limite','Base','Valor-limite']];
  somar().sort(function(a,b){ return grupo(a.cod).localeCompare(grupo(b.cod))||(b.pl*b.q)-(a.pl*a.q); })
    .forEach(function(r){ B.push([r.cod,r.nome,r.un,r.q,pedido(r.q,r.un),r.pl,r.base,r.pl*r.q]); });
  var w2=XLSX.utils.aoa_to_sheet(B); w2['!cols']=[{wch:10},{wch:58},{wch:6},{wch:13},{wch:11},{wch:13},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,w2,'MATERIAL');
  var d=new Date(), dd=('0'+d.getDate()).slice(-2)+('0'+(d.getMonth()+1)).slice(-2)+d.getFullYear();
  XLSX.writeFile(wb,'MATERIAL-FDE_'+dd+'.xlsx');
}

if(!Object.keys(C).length){
  document.getElementById('app').innerHTML=
    '<div class="vazio">O banco de composições (comp.js) não carregou. Rode <b>gera_comp_js.py</b> e publique.</div>';
}else render();
})();
</script>
