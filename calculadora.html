/* ===========================================================================

   gera_comp_js.py junta os 99 num banco so — 837 servicos. Conferido em
   08/10/2026: ZERO divergencia de coeficiente entre obras, porque o coeficiente
   e da FDE e nao da obra.

   Entao 5 m de muro FD-16 nao e estimativa: e 5 x o coeficiente da propria FDE.

   O preco. A FDE publica o preco do SERVICO e os coeficientes, nunca o preco do
   insumo — o que aparece aqui como "preco-limite" e um teto, com o grau de
   certeza na coluna Base, a mesma regra da aba Composicoes do painel. E o preco
   do servico varia entre obras (boletins de datas diferentes): 440 dos 839
   servicos tem mais de um preco nos orcamentos publicados. Por isso o resultado
   principal desta pagina e QUANTIDADE, e o valor vem depois, rotulado como teto.
=========================================================================== */

function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nm(v,d){ return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }

  return g==='1'?'mo':(g==='8'||g==='9'?'eq':'mat'); }

/* unidades que so fazem sentido inteiras: quem pede 28,6 blocos pede 29 */
var INTEIRO={UN:1,CJ:1,PC:1,PÇ:1,BR:1,JG:1,MI:1};
function pedido(q,un){ return INTEIRO[String(un).toUpperCase()]?Math.ceil(q-1e-9):q; }
/* ajudas praticas de pedido, sem inventar: so converte unidade */
function extra(ins,q,un){

}

/* ---- projetos padrao da FDE que ja tem composicao no banco ---------------

/* ===========================================================================

/* ===========================================================================
   MODELOS PELO DESENHO — 09/10/2026
   Regra do Luis: quando o desenho do projeto padrão e a composição da FDE
   discordam, VALE O DESENHO. A composição continua aparecendo ao lado, para a
   conferência da medição.

   Cada modelo recebe as medidas digitadas e devolve as linhas de quantitativo
   com a conta escrita (memória de cálculo). As linhas com "ins" substituem o
   insumo de mesmo código da composição FDE na lista de material; as demais são
   informativas (volumes de argamassa, graute, áreas de revestimento).

   Fonte de cada número: as pranchas do Catálogo de Componentes da FDE em
   00. CATALOGOS TECNICOS FDE/07 - Componentes, lidas em 09/10/2026.
=========================================================================== */
var KGM={'4.2':0.109,'5':0.154,'6.3':0.245,'8':0.395,'10':0.617,'12.5':0.963};
var BARRA_CHATA={'1x1/4':1.266,'1/2x1/8':0.3165,'19x4.76':0.712,'76x8':4.773};
var PI=Math.PI;
function r2(v){ return Math.round(v*100)/100; }
function f2(v,d){ return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }
function ceil(v){ return Math.ceil(v-1e-9); }

/* acumulador de aço: soma metros por bitola, guarda a conta de cada parcela */
function Aco(){ this.m={}; this.c={}; }
Aco.prototype.add=function(d,metros,conta){
  this.m[d]=(this.m[d]||0)+metros; (this.c[d]=this.c[d]||[]).push(conta+' = '+f2(metros)+' m'); };
Aco.prototype.linhas=function(sec,ca50,ca60){
  var L=[], self=this;
  Object.keys(this.m).sort(function(a,b){return +b-+a;}).forEach(function(d){
    var m=self.m[d], kg=m*KGM[d], fino=(+d<=5);
    var ins=fino&&ca60?ca60:ca50;
    L.push({sec:sec, item:'Aço '+(fino&&ca60?'CA-60':'CA-50')+' ø'+d.replace('.',',')+' mm', q:kg, un:'kg', ins:ins,
      conta:self.c[d].join(' · ')+' → '+f2(m)+' m × '+f2(KGM[d],3)+' kg/m',
      extra:ceil(m/12)+' barra(s) de 12 m', bit:d, metros:m});
  });
  return L;
};

/* trespasse de barra corrida: 50 diâmetros a cada 12 m */
function corrida(L,d){ return L*(1+0.05*(+d)/12); }

/* ---------------------------------------------------------------- muros FD */
/* FD-16 e FD-24 têm a mesma fundação: broca ø25 + baldrame 25×20 + pilarete 14×14 */
function muroBase(o){
  var L=o.L, out=[], aco=new Aco();
  var vaos=ceil(L/o.esp), pil=vaos+1, Lalv=Math.max(L-pil*0.14,0);
  out.push({sec:'Peças', item:'Vãos entre pilaretes', q:vaos, un:'un', conta:'L ÷ '+f2(o.esp)+' m = '+f2(L/o.esp)+', arredondado para cima'});
  out.push({sec:'Peças', item:'Pilaretes 14×14 cm', q:pil, un:'un', conta:'vãos + 1'});
  out.push({sec:'Peças', item:'Brocas ø25 cm × '+f2(o.prof)+' m', q:pil, un:'un', conta:'1 sob cada pilarete'});
  out.push({sec:'Peças', item:'Juntas de dilatação 2 cm', q:Math.max(0,ceil(L/30)-1), un:'un', conta:'a cada 30,00 m no máximo'});
  var vBroca=pil*PI*0.125*0.125*o.prof, vBald=L*0.25*0.20, vPil=pil*0.14*0.14*o.hp, vCim=L*0.0110;
  out.push({sec:'Concreto fck 25', item:'Brocas', q:vBroca, un:'m³', ins:'2.05.36', conta:pil+' × π × 0,125² × '+f2(o.prof)});
  out.push({sec:'Concreto fck 25', item:'Viga baldrame 25×20', q:vBald, un:'m³', ins:'2.05.36', conta:f2(L)+' × 0,25 × 0,20'});
  out.push({sec:'Concreto fck 25', item:'Pilaretes 14×14', q:vPil, un:'m³', ins:'2.05.36', conta:pil+' × 0,14 × 0,14 × '+f2(o.hp)+' (topo do baldrame à cimalha)'});
  out.push({sec:'Concreto fck 25', item:'Cimalha com pingadeira', q:vCim, un:'m³', ins:'2.05.36', conta:f2(L)+' × 0,0110 m² (Det. 01: 23×5 cm menos a pingadeira)'});
  /* aço */
  aco.add('12.5', pil*4*(o.prof+0.15), 'brocas: '+pil+' × 4 × ('+f2(o.prof)+' + 0,15 ancoragem)');
  var nEb=Math.floor(o.prof/0.15)+1;
  aco.add('4.2', pil*nEb*(PI*0.19+0.10), 'estribos broca: '+pil+' × '+nEb+' × (π×0,19 + 0,10)');
  aco.add('10', 4*corrida(L,'10'), 'baldrame: 4 × '+f2(L)+' + trespasse');
  var nEv=ceil(L/0.12)+1;
  aco.add('5', nEv*0.76, 'estribos baldrame: '+nEv+' × 0,76 (19×14 + ganchos)');
  aco.add('12.5', pil*4*(o.hp+0.25), 'pilaretes: '+pil+' × 4 × ('+f2(o.hp)+' + 0,25 ancoragem)');
  var nEp=ceil(o.hp/0.12)+1;
  aco.add('5', pil*nEp*0.46, 'estribos pilarete: '+pil+' × '+nEp+' × 0,46 (9×9 + ganchos)');
  aco.add('6.3', o.canaletas*2*corrida(L,'6.3'), 'canaletas: '+o.canaletas+' × 2 × '+f2(L)+' + trespasse');
  var lados=Math.max(2*pil-2,0), niv=Math.floor(o.fiadas/2);
  aco.add('6.3', lados*niv*0.80, 'amarração bloco/pilarete: '+lados+' lados × '+niv+' níveis × 0,80');
  /* alvenaria */
  var nB=o.blocosFiadas*Lalv/0.40, nC=o.canaletas*Lalv/0.40;
  out.push({sec:'Alvenaria', item:'Bloco de concreto 14×19×39', q:nB, un:'un', ins:'2.25.77',
    conta:o.blocosFiadas+' fiadas × '+f2(Lalv)+' m ÷ 0,40 (L menos '+pil+' pilaretes de 0,14)'});
  out.push({sec:'Alvenaria', item:'Bloco canaleta 14×19×39', q:nC, un:'un', ins:'2.25.96',
    conta:o.canaletas+' fiada(s) × '+f2(Lalv)+' m ÷ 0,40'});
  out.push({info:1,sec:'Argamassas (volume)', item:'Graute das canaletas', q:o.canaletas*Lalv*0.0135, un:'m³',
    conta:o.canaletas+' × '+f2(Lalv)+' × 0,0135 m² (vazio da canaleta 9×15 cm)'});
  if(o.enchidas) out.push({info:1,sec:'Argamassas (volume)', item:'Graute dos blocos enterrados (com enchimento)', q:o.enchidas*Lalv*0.0133, un:'m³',
    conta:o.enchidas+' fiadas × '+f2(Lalv)+' × 0,0133 m³/m (2 furos por bloco)'});
  var aAlv=Lalv*o.halv;
  out.push({info:1,sec:'Argamassas (volume)', item:'Argamassa de assentamento 1:0,5:4,5', q:aAlv*0.0103, un:'m³',
    conta:f2(aAlv)+' m² de alvenaria × 0,0103 m³/m² (junta de 1 cm)'});
  out.push({info:1,sec:'Revestimento', item:'Chapisco fino, duas faces', q:2*L*o.hfora, un:'m²',
    conta:'2 × '+f2(L)+' × '+f2(o.hfora)+' (acima do terreno)'});
  out.push({info:1,sec:'Impermeabilização', item:'Cristalização: baldrame + embasamento + 15 cm', q:L*(0.25+2*0.20+2*(0.30+0.15)), un:'m²',
    conta:f2(L)+' × (0,25 + 2×0,20 + 2×0,45)'});
  return {out:out, aco:aco, pil:pil, vaos:vaos};
}

/* FQ-01: fundos (mureta 120, tela 4,00) e laterais (mureta 60, tela 2,40) */
function fq01(L,tipo,ext){
  var fun=(tipo==='fundos'), Hm=fun?1.20:0.60, Ht=fun?4.00:2.40, fi=fun?6:3, bl=fi-1;
  var vaos=Math.max(1,ceil(L/2.50)), mont=vaos+1, pil=mont, Lalv=Math.max(L-pil*0.14,0);
  var pares=Math.max(0,ceil(L/10)-1), out=[], aco=new Aco();
  out.push({sec:'Peças', item:'Vãos (250 cm)', q:vaos, un:'un', conta:'L ÷ 2,50, para cima'});
  out.push({sec:'Peças', item:'Pilaretes 14×14 / montantes', q:pil, un:'un', conta:'vãos + 1'});
  out.push({sec:'Peças', item:'Brocas ø20 × 3,00 m', q:pil, un:'un', conta:'1 sob cada pilarete'});
  out.push({sec:'Concreto fck 25', item:'Brocas', q:pil*PI*0.10*0.10*3.0, un:'m³', ins:'2.05.36', conta:pil+' × π × 0,10² × 3,00'});
  out.push({sec:'Concreto fck 25', item:'Viga baldrame 20×20', q:L*0.20*0.20, un:'m³', ins:'2.05.36', conta:f2(L)+' × 0,20 × 0,20'});
  out.push({sec:'Concreto fck 25', item:'Pilaretes 14×14', q:pil*0.14*0.14*Hm, un:'m³', ins:'2.05.36', conta:pil+' × 0,14 × 0,14 × '+f2(Hm)});
  aco.add('10', 4*corrida(L,'10'), 'baldrame: 4 × '+f2(L)+' + trespasse');
  var nEv=ceil(L/0.12)+1; aco.add('5', nEv*0.66, 'estribos baldrame: '+nEv+' × 0,66 (14×14 + ganchos)');
  aco.add('10', pil*4*(Hm+0.20), 'pilaretes: '+pil+' × 4 × ('+f2(Hm)+' + 0,20 ancoragem)');
  var nEp=ceil(Hm/0.12)+1; aco.add('5', pil*nEp*0.46, 'estribos pilarete: '+pil+' × '+nEp+' × 0,46');
  aco.add('6.3', 2*corrida(L,'6.3'), 'canaleta: 2 × '+f2(L)+' + trespasse');
  var lados=Math.max(2*pil-2,0), niv=Math.floor(fi/2);

function junta(cod,q,d){
  if(d&&MODELOS[cod]){ P.push({c:cod,q:q,d:d}); salva(); render(); return; }
  var i=P.findIndex(function(x){ return x.c===cod&&!x.d; });
  if(i>=0) P[i].q=Math.round((P[i].q+q)*1e6)/1e6; else P.push({c:cod,q:q});
  salva(); render();
}
function descD(it){
  var M=MODELOS[it.c]; if(!M||!it.d) return '';
  return M.campos.map(function(f){ var v=it.d[f.k];
    if(f.sel){ var o=f.sel.filter(function(x){return x[0]===v;})[0]; return f.r+': '+(o?o[1]:nm(v,2)); }
    return f.r.replace(/ \(.*\)/,'')+' '+nm(v,f.int?0:2); }).join(' · ');
}
function calcIt(it){ return (MODELOS[it.c]&&it.d)?MODELOS[it.c].calc(it.d):null; }

/* ---- insumos somados do projeto inteiro ----------------------------------
   Item com modelo de desenho: o que o desenho quantifica SUBSTITUI o insumo de
   mesmo código da composição (regra: vale o desenho); o resto da composição
   (mão de obra, fôrma, cimento, cal, areia, pintura...) continua pelo
   coeficiente da FDE. A coluna "composição" guarda o que o boletim daria. */
function somar(){
  var m={}, ordem={exato:0,apertado:1,indicativo:2,frouxo:3};
  function lin(k,nome,un,pl,base){ return m[k]||(m[k]={cod:k,nome:nome,un:un,q:0,qc:0,temC:false,pl:pl,base:base,fonte:{},extra:[]}); }
  P.forEach(function(it){
    var R=calcIt(it), cob={};
    if(R){
      R.linhas.forEach(function(l){
        if(l.info||l.sec==='Peças') return;
        var x=l.ins?(C[it.c]||[]).filter(function(y){return y[0]===l.ins;})[0]:null;
        var k=l.ins?('D:'+l.ins):('d:'+l.item+'|'+l.un);
        var nome=l.ins?((x&&x[1])||(S[l.ins]&&S[l.ins][0])||l.item):l.item;
        var r=lin(k,nome,l.un.toUpperCase(),x?x[4]:null,x?x[5]:null);
        if(l.ins&&!x){ r.nome=l.item; }
        r.q+=l.q; r.fonte.desenho=1;
        if(l.ins){ cob[l.ins]=1; r.subm=r.subm||{}; var sk=l.bit?l.item:l.item; r.subm[sk]=(r.subm[sk]||0)+l.q; }
        if(l.bit){ r.bit=r.bit||{}; r.bit[l.bit]=(r.bit[l.bit]||0)+l.metros; }
        else if(l.extra) r.extra.push(l.extra);
      });
      /* o que o boletim daria para os mesmos insumos, para comparar */
      (C[it.c]||[]).forEach(function(x){ var k2='D:'+x[0]; if(cob[x[0]]&&m[k2]){ m[k2].qc+=x[3]*it.q; m[k2].temC=true; } });
    }
    (C[it.c]||[]).forEach(function(x){
      if(cob[x[0]]) return;
      var r=lin(x[0],x[1],x[2],x[4],x[5]);
      r.q+=x[3]*it.q; r.qc+=x[3]*it.q; r.temC=true; r.fonte.composicao=1;
      if((ordem[x[5]]||0)>(ordem[r.base]||0)) r.base=x[5];
    });
  });
  return Object.keys(m).map(function(k){ return m[k]; });
}
function ehDes(r){ return !!r.fonte.desenho; }
function pedir(r){
  var q=ehDes(r)?r.q*(1+PERDA/100):r.q;
  return pedido(q,r.un);
}

  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var box=document.getElementById('sug');
  if(q.length<2){ box.hidden=true; box.innerHTML=''; return; }
  var ter=q.split(/\s+/);
  var L=Object.keys(C).filter(function(c){
    var t=(c+' '+S[c][0]).toLowerCase();
    return ter.every(function(w){ return t.indexOf(w)>=0; });
  }).slice(0,60);
  box.hidden=!L.length;
  box.innerHTML=L.map(function(c){
    return '<button type="button" data-sel="'+c+'"><span class="c">'+esc(c)+'</span>'+
      esc(S[c][0])+'<span class="u">· '+esc(S[c][1])+' · '+(C[c]||[]).length+' insumos</span></button>';
  }).join('');
}

function liga(){
  var app=document.getElementById('app');
  app.onclick=function(ev){
    var t=ev.target.closest('button,[data-rm]'); if(!t) return;
    if(t.dataset.pad){
      var c=t.dataset.pad, M=MODELOS[c];
      if(!M){
        var q0=parseFloat((document.getElementById('pf_'+c+'_q')||{}).value||'0')||0;
        if(!(q0>0)){ alert('Informe a medida.'); return; }
        junta(c, q0); return;
      }
      var d={}, falta=[];
      M.campos.forEach(function(f){
        var el=document.getElementById('pf_'+c+'_'+f.k), v=parseFloat((el||{}).value||'0')||0;
        if(f.int) v=Math.round(v);
        if(!(v>0)) falta.push(f.r); d[f.k]=v; });
      if(falta.length){ alert('Informe: '+falta.join(', ')+'.'); return; }
      if(c==='16.01.090'&&(d.H<1.2||d.H>2.0)){ alert('O FE-01 vai de 1,20 a 2,00 m de altura.'); return; }
      var q=Math.round(M.medida(d)*1e6)/1e6;
      junta(c, q, d); return;
    }
    if(t.dataset.sel){
      escolha=t.dataset.sel;
      document.getElementById('sug').hidden=true;
      document.getElementById('q').value=escolha+' — '+S[escolha][0];
      document.getElementById('escolhido').textContent=
        'Escolhido: '+escolha+' — '+S[escolha][0]+' (medido em '+S[escolha][1]+'). Digite a quantidade e tecle Enter.';
      document.getElementById('qq').focus(); return;
    }
    if(t.dataset.rm!=null){ P.splice(+t.dataset.rm,1); salva(); render(); return; }
    if(t.id==='limpar'){ if(confirm('Apagar o projeto inteiro?')){ P=[]; salva(); render(); } return; }
    if(t.id==='imprimir'){ window.print(); return; }
    if(t.id==='xls'){ excel(); return; }
  };
  var q=document.getElementById('q'); if(q) q.oninput=sugere;
  var qq=document.getElementById('qq');
  if(qq) qq.onkeydown=function(ev){
    if(ev.key!=='Enter') return;
    var v=parseFloat(qq.value||'0')||0;
    if(!escolha){ alert('Escolha um serviço na lista primeiro.'); return; }
    if(!(v>0)){ alert('Digite a quantidade.'); return; }
    junta(escolha, v);
  };
  app.addEventListener('change', function(ev){
    if(ev.target.id==='perda'){ var pv=parseFloat(ev.target.value||'0'); PERDA=(pv>=0&&pv<=50)?pv:5;
      try{ localStorage.setItem('calcFdePerda',String(PERDA)); }catch(e){} render(); return; }
    var i=ev.target.dataset&&ev.target.dataset.q; if(i==null) return;
    var v=parseFloat(ev.target.value||'0')||0;
    if(v>0){ P[+i].q=v; } else { P.splice(+i,1); }
    salva(); render();
  });
}

function excel(){
  if(typeof XLSX==='undefined'){ alert('A planilha não carregou — tente de novo com conexão.'); return; }
  var wb=XLSX.utils.book_new();
  var A=[['Código','Serviço','Medidas (desenho)','Quantidade','Un']];
  P.forEach(function(it){ A.push([it.c,S[it.c][0],descD(it),it.q,S[it.c][1]]); });
  var w1=XLSX.utils.aoa_to_sheet(A); w1['!cols']=[{wch:11},{wch:60},{wch:40},{wch:12},{wch:6}];
  XLSX.utils.book_append_sheet(wb,w1,'PROJETO');
  var Q=[['Serviço','Medidas','Grupo','Item','Quantidade','Un','Conta (memória de cálculo)','Observação']];
  P.forEach(function(it){ var R=calcIt(it); if(!R) return;
    R.linhas.forEach(function(l){ Q.push([it.c,descD(it),l.sec,l.item,Math.round(l.q*1000)/1000,l.un,l.conta,l.extra||'']); }); });
  if(Q.length>1){ var wq=XLSX.utils.aoa_to_sheet(Q); wq['!cols']=[{wch:11},{wch:30},{wch:18},{wch:44},{wch:12},{wch:6},{wch:80},{wch:22}];
    XLSX.utils.book_append_sheet(wb,wq,'QUANTITATIVO DESENHO'); }
  var B=[['Código','Insumo','Un','Quantidade','Pedir','Fonte','Composição FDE','Preço-limite','Base','Valor-limite']];
  somar().sort(function(a,b){ return (ehDes(b)-ehDes(a))||((b.pl||0)*b.q-(a.pl||0)*a.q); })
    .forEach(function(r){ B.push([r.cod.indexOf('d:')===0?'':r.cod.replace(/^D:/,''),r.nome,r.un,r.q,pedir(r),ehDes(r)?'desenho':'composição',
      ehDes(r)?(r.temC?r.qc:''):r.q,r.pl||'',r.base||'',r.pl?r.pl*r.q:'']); });
  var w2=XLSX.utils.aoa_to_sheet(B); w2['!cols']=[{wch:10},{wch:58},{wch:6},{wch:13},{wch:11},{wch:11},{wch:14},{wch:13},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,w2,'MATERIAL');
  var d=new Date(), dd=('0'+d.getDate()).slice(-2)+('0'+(d.getMonth()+1)).slice(-2)+d.getFullYear();
  XLSX.writeFile(wb,'MATERIAL-FDE_'+dd+'.xlsx');
}

if(!Object.keys(C).length){
  document.getElementById('app').innerHTML=
    '<div class="vazio">O banco de composições (comp.js) não carregou. Rode <b>gera_comp_js.py</b> e publique.</div>';
}else render();
})();
</script>
