<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório de visita — Obras FDE</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#dcdad3;--pri:#1f4e79;--ok:#2f6f4e;--okb:#e6f4ec;--bad:#b3261e;--badb:#fbe0de;--warn:#b98b18;--warnb:#fdf4de}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#7fb0de;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;flex:1;min-width:180px}
header.top .nota{font-size:13px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:8px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:12px 16px 120px}
section{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:12px 0;padding:12px 14px}
section h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:block;font-size:12.5px;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;min-height:36px}
textarea{min-height:70px;resize:vertical}
.ast{color:var(--bad)}
.q{padding:8px 0;border-bottom:1px dashed var(--ln)}
.q:last-child{border-bottom:0}
.q .t{font-size:14px;margin-bottom:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:650}
.seg button.on.r{background:var(--badb);border-color:var(--bad);color:var(--bad)}
button.bt{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:650}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.fotos .ft{border:1px solid var(--ln);border-radius:10px;overflow:hidden;position:relative}
.fotos img{width:100%;height:110px;object-fit:cover;display:block}
.fotos input{border:0;border-top:1px solid var(--ln);border-radius:0;width:100%;font-size:12.5px}
.fotos .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;padding:2px 8px;cursor:pointer}
footer.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:6}
footer.bar .msg{flex:1;font-size:13px;color:var(--mut);min-width:180px}
.aviso{background:var(--warnb);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.okmsg{background:var(--okb);border:1px solid var(--ok);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header class="top"><h1>Relatório de visita</h1><span class="nota" id="hObra">escolha a obra</span></header>
<main id="app"><p class="mut">Carregando…</p></main>
<footer class="bar"><span class="msg" id="msg">Rascunho salvo neste aparelho automaticamente.</span>
<button class="bt" id="btLimpar">Limpar</button><button class="bt pri" id="btEnviar">Enviar relatório</button></footer>
<script src="sst_modelo.js"></script>
<script>
(function(){
'use strict';
/* 02/10/2026: o relatorio de visita (RAO) dentro do painel, no mesmo esquema do formulario
   de seguranca. Grava no Google Form de 1 campo "Formularios do painel" (parte:'rao' e as
   fotos em pedacos parte:'rao_foto'); o rao_painel.py no Mac monta o relatorio de sempre. */
var SRV={form:'https://docs.google.com/forms/d/e/1FAIpQLSeUr4exNdJSwZw80uo9nU9bsRHCZtBEd9QG4w73NMtn_y9zlw/formResponse',entry:'entry.2131162142'};
var OBRAS=((window.SST_MOD||{}).obras)||[], MAXF=15;
var Q=new URLSearchParams(location.search), CH='raoRascunho', CHF='raoRascunhoF', CHQ='raoQuem';
var ENG=['Eng. Leonardo','Eng. Douglas','Eng. Luis Júnior'];
var PERG=[['mao_de_obra','Mão de obra',['Suficiente','Insuficiente']],['material','Material em canteiro',['Suficiente','Insuficiente']],
  ['equipamentos','Equipamentos',['Suficiente','Insuficiente']],['tempo','Tempo',['Seco','Chuva']],
  ['falhas','Falhas construtivas a serem corrigidas',['Sim','Não']],['placa','Placa de obra instalada',['Sim','Não']],
  ['andamento','Andamento dos serviços',['Não iniciada','Em execução','Obra paralisada','Obra concluída','Em rescisão']],
  ['ritmo','Ritmo da obra',['Normal','Lento','Parado']]];
var RUIM={mao_de_obra:'Insuficiente',material:'Insuficiente',equipamentos:'Insuficiente',falhas:'Sim',placa:'Não',ritmo:'Lento|Parado',andamento:'Obra paralisada|Em rescisão'};
var TXT=[['servicos','Serviços executados','um por linha'],['observacoes','Observações','uma por linha'],
  ['recomendacoes','Recomendações à contratada','uma por linha'],['pendencias','Pendências em aberto','uma por linha']];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function agora(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function novo(){ return {v:1,obra:Q.get('obra')||'',data:hoje(),hora:agora(),func:'',r:{},t:{},quem:ls(CHQ)||''}; }
var S; try{ S=JSON.parse(ls(CH)||'null'); }catch(e){ S=null; }
if(!S||S.v!==1) S=novo();
if(Q.get('obra')&&String(S.obra)!==Q.get('obra')&&!Object.keys(S.r).length&&!Object.keys(S.t).length) S=novo();
var F=[]; try{ F=JSON.parse(ls(CHF)||'[]'); }catch(e){ F=[]; }   /* [{u:dataURL,l:legenda}] */
function salva(){ ls(CH,JSON.stringify(S)); try{ localStorage.setItem(CHF,JSON.stringify(F)); }catch(e){ msg('Fotos demais para guardar no rascunho — envie logo ou tire alguma.'); } }
function nomeObra(c){ var o=OBRAS.filter(function(x){return String(x[0])===String(c);})[0]; return o?o[1]:''; }
function msg(t){ document.getElementById('msg').textContent=t; }

function render(){
  var h='<section><h2>Visita</h2><div class="grid">'+
    '<label class="f">Obra <b class="ast">*</b><select id="fObra"><option value="">escolha…</option>'+OBRAS.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(S.obra)?' selected':'')+'>'+o[0]+' — '+esc(o[1])+'</option>';}).join('')+'</select></label>'+
    '<label class="f">Data da visita <b class="ast">*</b><input type="date" id="fData" value="'+esc(S.data)+'"></label>'+
    '<label class="f">Hora da visita<input type="time" id="fHora" value="'+esc(S.hora)+'"></label>'+
    '<label class="f">Número de funcionários<input type="number" min="0" id="fFunc" value="'+esc(S.func)+'"></label>'+
    '<label class="f">Quem preencheu <b class="ast">*</b><input id="fQuem" list="engs" value="'+esc(S.quem)+'" placeholder="Eng. …"><datalist id="engs">'+ENG.map(function(e){return '<option value="'+esc(e)+'">';}).join('')+'</datalist></label>'+
    '</div></section>';
  h+='<section><h2>Itens verificados</h2>'+PERG.map(function(p){ var v=S.r[p[0]]||'';
      return '<div class="q" data-k="'+p[0]+'"><div class="t">'+esc(p[1])+'</div><div class="seg">'+p[2].map(function(o){
        var ruim=new RegExp('^('+(RUIM[p[0]]||'#')+')$').test(o);
        return '<button data-v="'+esc(o)+'" class="'+(v===o?'on':'')+(ruim?' r':'')+'">'+esc(o)+'</button>'; }).join('')+'</div></div>'; }).join('')+'</section>';
  h+='<section><h2>Anotações</h2>'+TXT.map(function(t){ return '<label class="f">'+esc(t[1])+(t[0]==='servicos'?' <b class="ast">*</b>':'')+
      '<textarea data-t="'+t[0]+'" placeholder="'+esc(t[2])+'">'+esc(S.t[t[0]]||'')+'</textarea></label>'; }).join('')+'</section>';
  h+='<section><h2>Fotos <span class="mut" id="nF"></span></h2>'+
    '<p class="mut">Até '+MAXF+' fotos. Cada foto é reduzida no próprio celular antes de enviar. Não enviar foto em que dê para identificar aluno — o relatório vai para o painel.</p>'+
    '<input type="file" accept="image/*" multiple id="fFotos"><div class="fotos" id="fotos"></div></section>';
  h+='<section><div id="resultado"></div><p class="mut">O % de avanço, a previsão de término e os pedidos do Sienge entram sozinhos no relatório (vêm da medição, do CTR e do Sienge). O relatório aparece na aba <b>Relatório de visita</b> da obra depois da rodada no Mac.</p></section>';
  document.getElementById('app').innerHTML=h; desenhaFotos(); topo();
}
function topo(){ document.getElementById('hObra').textContent=S.obra?(S.obra+' — '+nomeObra(S.obra)):'escolha a obra'; }
function desenhaFotos(){
  document.getElementById('nF').textContent='('+F.length+' de '+MAXF+')';
  document.getElementById('fotos').innerHTML=F.map(function(f,i){ return '<div class="ft"><img src="'+f.u+'" alt="foto '+(i+1)+'"><button class="x" data-rm="'+i+'">×</button>'+
    '<input data-leg="'+i+'" value="'+esc(f.l||'')+'" placeholder="legenda (ex.: Pintura - fachada)"></div>'; }).join('');
}
function reduz(f){ return new Promise(function(ok){ var r=new FileReader(); r.onload=function(){ var im=new Image(); im.onload=function(){
  var m=1280, s=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',0.62)); }; im.onerror=function(){ ok(null); }; im.src=r.result; }; r.readAsDataURL(f); }); }

document.addEventListener('click',function(e){ var t=e.target;
  if(t.matches('.seg button')){ var k=t.closest('.q').dataset.k, v=t.dataset.v; S.r[k]=(S.r[k]===v?undefined:v); if(!S.r[k]) delete S.r[k];
    t.closest('.seg').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.dataset.v===S.r[k]); }); salva(); return; }
  if(t.dataset.rm!=null){ F.splice(+t.dataset.rm,1); salva(); desenhaFotos(); return; }
  if(t.id==='btLimpar'){ if(!limpar){ limpar=true; msg('Clique de novo em Limpar para apagar este rascunho.'); setTimeout(function(){limpar=false;},4000); return; }
    var q=S.quem; S=novo(); S.quem=q; F=[]; salva(); render(); msg('Rascunho apagado.'); return; }
  if(t.id==='btEnviar'){ enviar(); }
});
var limpar=false;
document.addEventListener('input',function(e){ var t=e.target, d=t.dataset;
  if(t.id==='fObra'){ S.obra=t.value; topo(); }
  else if(t.id==='fData') S.data=t.value; else if(t.id==='fHora') S.hora=t.value; else if(t.id==='fFunc') S.func=t.value;
  else if(t.id==='fQuem'){ S.quem=t.value; ls(CHQ,t.value); }
  else if(d.t) S.t[d.t]=t.value; else if(d.leg!=null) F[+d.leg].l=t.value; else return;
  salva(); });
document.addEventListener('change',function(e){ var t=e.target; if(t.id!=='fFotos') return;
  var fs=[].slice.call(t.files||[]), cabe=MAXF-F.length; if(fs.length>cabe){ msg('Só cabem mais '+cabe+' foto(s); as demais ficaram de fora.'); fs=fs.slice(0,cabe); }
  if(!fs.length) return; msg('Reduzindo '+fs.length+' foto(s)…');
  Promise.all(fs.map(reduz)).then(function(us){ us.filter(Boolean).forEach(function(u){ F.push({u:u,l:''}); }); t.value=''; salva(); desenhaFotos(); msg(F.length+' foto(s) anexada(s).'); });
});
function faltas(){ var f=[];
  if(!S.obra) f.push('a obra'); if(!S.data) f.push('a data da visita'); if(!(S.quem||'').trim()) f.push('quem preencheu');
  if(!(S.t.servicos||'').trim()) f.push('os serviços executados');
  var semR=PERG.filter(function(p){ return !S.r[p[0]]; }).map(function(p){ return p[1].toLowerCase(); }); if(semR.length) f.push('responder: '+semR.join(', '));
  return f; }
function posta(o){ var fd=new FormData(); fd.append(SRV.entry,JSON.stringify(o)); return fetch(SRV.form,{method:'POST',mode:'no-cors',body:fd}); }
var enviando=false;
function enviar(){ if(enviando) return;
  var f=faltas(); if(f.length){ document.getElementById('resultado').innerHTML='<div class="aviso">Falta: '+esc(f.join('; '))+'.</div>'; msg('Falta preencher alguns campos — veja no fim da página.'); window.scrollTo(0,document.body.scrollHeight); return; }
  enviando=true; var id='v'+S.obra+'-'+Date.now().toString(36);
  var d=JSON.parse(JSON.stringify(S)); d.parte='rao'; d.idv=id; d.unidade=nomeObra(S.obra); d.enviado=new Date().toISOString();
  d.fotos=F.map(function(x,i){ return {i:i,l:x.l||''}; });
  var pecas=[]; F.forEach(function(x,i){ var b=(x.u.split(',')[1]||''), n=Math.ceil(b.length/30000);
    for(var k=0;k<n;k++) pecas.push({v:1,parte:'rao_foto',idv:id,f:i,k:k,n:n,b:b.slice(k*30000,(k+1)*30000)}); });
  var tot=pecas.length+1, feito=0; msg('Enviando 1 de '+tot+'…');
  posta(d).then(function(){ feito++; return pecas.reduce(function(p,pc){ return p.then(function(){ return posta(pc).then(function(){ feito++; msg('Enviando '+feito+' de '+tot+'… (não feche a página)'); }); }); },Promise.resolve()); })
  .then(function(){ enviando=false; var ob=S.obra, n=F.length, q=S.quem; S=novo(); S.quem=q; S.obra=ob; F=[]; salva(); render();
    document.getElementById('resultado').innerHTML='<div class="okmsg"><b>Relatório enviado.</b> Código '+esc(id)+' · obra '+esc(ob)+' · '+n+' foto(s).'+
      '<div class="mut">Ele entra na aba Relatório de visita da obra na próxima rodada. O rascunho foi apagado deste aparelho.</div></div>';
    msg('Enviado (código '+id+').'); window.scrollTo(0,document.body.scrollHeight); })
  .catch(function(){ enviando=false; msg('Sem conexão — o rascunho continua salvo; tente enviar de novo.'); });
}
render();
})();
</script>
</body>
</html>
