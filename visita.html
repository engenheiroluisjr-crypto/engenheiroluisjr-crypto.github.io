 document.documentElement.setAttribute('data-paleta',p==='terracota'?'terracota':'azul');})();
(function(){var t;try{t=localStorage.getItem('painelTema');}catch(e){}
 if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}
 document.documentElement.setAttribute('data-tema',t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute('content',t==='claro'?'#f4f3ef':'#161615');})();

:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#dcdad3;--pri:#c2501f;--priBar:#c2501f;--ok:#2f6f4e;--okb:#e6f4ec;--bad:#b3261e;--badb:#fbe0de;--warn:#b98b18;--warnb:#fdf4de}
/* 06/10: o tema agora vem do data-tema (painelTema); o prefers-color-scheme fica

   do topo ganha --priBar, que escurece: antes ela clareava com o texto branco em

html[data-tema="escuro"]{--bg:#161615;--card:#22221f;--tx:#ecebe6;--mut:#a3a29c;--ln:#3a3935;--pri:#e8825a;--priBar:#a6431a;--ok:#7fc7a0;--okb:#1f3a2c;--bad:#f08a80;--badb:#4a2220;--warn:#e5c062;--warnb:#3d3420}
*{box-sizing:border-box}

footer.bar .msg{flex:1;font-size:13px;color:var(--mut);min-width:180px}
.aviso{background:var(--warnb);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.okmsg{background:var(--okb);border:1px solid var(--ok);border-radius:10px;padding:12px;margin:10px 0}

.pd{padding:9px 0;border-bottom:1px dashed var(--ln)}
.solAdd{display:grid;gap:6px;margin:10px 0 4px;padding:10px;border:1px dashed var(--ln);border-radius:8px}.solAdd input{padding:8px;font:inherit;border:1px solid var(--ln);border-radius:6px;background:transparent;color:inherit}.smx button{padding:6px 10px;font:inherit;border-radius:6px;border:1px solid var(--ln);cursor:pointer;margin-top:4px}.solAdd button{padding:8px;font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--ln);cursor:pointer}
.pd:last-child{border-bottom:0}
.pd .h{font-size:14px}.pd .h b{color:var(--pri)}
.pd .it{font-size:12.5px;color:var(--mut);margin:2px 0 6px}
.pd.falta .h::after{content:' · responder';color:var(--bad);font-size:12px;font-weight:600}
.sb{display:flex;gap:6px;flex-wrap:wrap}

.sb button.on.E{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:650}
.sb button.on.P{background:var(--warnb);border-color:var(--warn);color:var(--warn);font-weight:650}
.sb button.on.N{background:var(--badb);border-color:var(--bad);color:var(--bad);font-weight:650}
.sb button.on.C{background:var(--nab,#eeede8);border-color:var(--mut);color:var(--mut);font-weight:650;text-decoration:line-through}
.pd.sol .h b{color:var(--warn)}.pd.sol.falta .h::after{content:''}
details.canc{margin-top:8px;font-size:13px;color:var(--mut)}details.canc li{margin:2px 0}

<script>
(function(){
'use strict';
/* 02/10/2026: o relatorio de visita (RAO) dentro do painel, no mesmo esquema do formulario
   de seguranca. Grava no Google Form de 1 campo "Formularios do painel" (parte:'rao' e as
   fotos em pedacos parte:'rao_foto'); o rao_painel.py no Mac monta o relatorio de sempre. */
var SRV={form:'https://docs.google.com/forms/d/e/1FAIpQLSeUr4exNdJSwZw80uo9nU9bsRHCZtBEd9QG4w73NMtn_y9zlw/formResponse',entry:'entry.2131162142'};
var OBRAS=((window.SST_MOD||{}).obras)||[], MAXF=15;
var Q=new URLSearchParams(location.search), CH='raoRascunho', CHF='raoRascunhoF', CHQ='raoQuem';
var ENG=['Eng. Leonardo','Eng. Douglas','Eng. Luis Júnior'];
var PERG=[['mao_de_obra','Mão de obra',['Suficiente','Insuficiente']],['material','Material em canteiro',['Suficiente','Insuficiente']],
  ['equipamentos','Equipamentos',['Suficiente','Insuficiente']],['tempo','Tempo',['Seco','Chuva']],
  ['falhas','Falhas construtivas a serem corrigidas',['Sim','Não']],
  ['andamento','Andamento dos serviços',['Não iniciada','Em execução','Obra paralisada','Obra concluída','Em rescisão']],
  ['ritmo','Ritmo da obra',['Normal','Lento','Parado']],
  ['limpeza','Organização e limpeza da obra',['Boa','Regular','Ruim']]];
var RUIM={mao_de_obra:'Insuficiente',material:'Insuficiente',equipamentos:'Insuficiente',falhas:'Sim',ritmo:'Lento|Parado',limpeza:'Ruim',andamento:'Obra paralisada|Em rescisão'};
var TXT=[['servicos','Serviços executados','um por linha'],['observacoes','Observações','uma por linha'],
  ['recomendacoes','Recomendações à contratada','uma por linha'],['pendencias','Pendências em aberto','uma por linha']];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function agora(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function novo(){ return {v:1,obra:Q.get('obra')||'',data:hoje(),hora:agora(),func:'',r:{},t:{},ent:{},quem:ls(CHQ)||''}; }
/* 02/10: entrega dos pedidos do Sienge — cada engenheiro responde na visita (obrigatorio).
   A resposta vai para o MESMO servidor de entregas da aba Pedidos do Sienge do painel
   (Google Form de 1 campo, JSON {pedido,s,por,quando,trava}); "Entregue" trava o pedido. */
var SG=window.SIENGE||{}, SGI=window.SIENGE_ITENS||{}, ESRV=window.ENTREGAS_SRV||{}, REM=null;
var STP=[['E','Entregue'],['P','Parcial'],['N','Não entregue'],['C','Cancelado']];
/* 08/10 (áudio do engenheiro): solicitação sem pedido de compra também aparece, como pendente — compras ainda não cotou */
var STS=[['N','Ainda precisa'],['E','Chegou por outro meio'],['C','Pode cancelar']];
var SAB=window.SIENGE_SOLIC_AB||{};
function tsq(q){ var m=/^(\d{2})\/(\d{2})\/(\d{4})[ ,]+(\d{2}):(\d{2})/.exec(q||''); return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).getTime():0; }
function dnum(d){ var m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(d||''); return m?+(m[3]+m[2]+m[1]):0; }
function csvP(t){ var L=[], r=[], f='', q=false; for(var i=0;i<t.length;i++){ var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ r.push(f); f=''; }
    else if(ch==='\n'){ r.push(f); L.push(r); r=[]; f=''; } else if(ch!=='\r') f+=ch; }
  if(f||r.length){ r.push(f); L.push(r); } return L; }
function lerServidor(){ if(!ESRV.ler){ REM={}; return Promise.resolve(); }
  return fetch(ESRV.ler+'&t='+Date.now()).then(function(r){ return r.text(); }).then(function(t){
    if(/<html/i.test(t.slice(0,200))) throw new Error('privada'); var o={};
    csvP(t).slice(1).forEach(function(l){ var m; try{ m=JSON.parse(l[1]); }catch(e){ return; }
      var p=String(m&&m.pedido||'').trim(); if(!p) return; var a=o[p];
      var r={s:m.s||null,trava:!!(m.trava&&m.s==='E'),destrava:!!m.destrava,sg:!!m.sg,quando:m.quando||'',por:m.por||'',obs:m.obs||''};
      if(a&&a.trava&&!r.destrava&&!(r.trava&&tsq(r.quando)<tsq(a.quando))) return; o[p]=r; });
    REM=o; }).catch(function(){ REM={}; }); }
function pedidosAbertos(){ var o=(SG.obras||{})[String(S.obra)]; if(!o) return []; var base=window.ENTREGAS||{};
  return (o.ped||[]).map(function(p){ var n=String(p[1]), se=(o.se||{})[n]||[], m=(REM&&REM[n])||base[n]||{};
      return {n:n,data:p[0],forn:p[2],se:se[0]||'',ult:m.s||'',por:m.por||'',quando:m.quando||'',fechado:(se[0]==='E'&&!(m.sg||m.destrava))||!!m.trava||m.s==='C',canc:m.s==='C',sgE:se[0]==='E',itens:((SGI[String(S.obra)]||{})[n]||[])}; })
    .filter(function(x){ return !x.fechado; }).sort(function(a,b){ return dnum(b.data)-dnum(a.data); }); }
/* 08/10: pedidos marcados como Cancelado (no painel ou numa visita anterior) nao pedem mais resposta */
function pedidosCancelados(){ var o=(SG.obras||{})[String(S.obra)]; if(!o) return []; var base=window.ENTREGAS||{};
  return (o.ped||[]).filter(function(p){ var n=String(p[1]), m=(REM&&REM[n])||base[n]||{}; return m.s==='C'; })
    .map(function(p){ var n=String(p[1]), m=(REM&&REM[n])||base[n]||{}; return {n:n,data:p[0],forn:p[2],por:m.por||'',quando:m.quando||''}; }); }
/* 08/10: solicitacoes do Sienge ainda sem pedido de compra (chave = -numero, igual ao painel) */
function solicAbertas(){ var L=SAB[String(S.obra)]||[], base=window.ENTREGAS||{};
  return L.map(function(x){ var k=String(-x[0]), m=(REM&&REM[k])||base[k]||{};
      var d=dnum(x[1]), hj=new Date(), dias=0; if(d){ var s=String(d); dias=Math.round((hj-new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)))/864e5); }
      return {k:k,sol:x[0],data:x[1],fin:String(x[2]||'').replace(/^SOLICI?T?A?DO POR [^F]*/i,''),st:x[3]||'',dias:dias,ult:m.s||'',por:m.por||'',quando:m.quando||'',obs:m.obs||'',itens:x[5]||[]}; })
    .filter(function(x){ return x.ult!=='C'&&x.ult!=='E'; }).sort(function(a,b){ return a.sol-b.sol; }); }
function secPedidos(){ var tit='<h2>Materiais — entrega dos pedidos do Sienge <b class="ast">*</b>';
  if(!S.obra) return '<section id="secPed">'+tit+'</h2><p class="mut">Escolha a obra.</p></section>';
  var L=pedidosAbertos(), sem=L.filter(function(x){ return !S.ent[x.n]; }).length;
  if(!L.length) return '<section id="secPed">'+tit+'</h2><p class="mut">'+(REM===null?'Carregando…':'Nenhum pedido em aberto no Sienge para esta obra.')+'</p>'+(REM===null?'':secSolic()+secCanc())+'</section>';
  return '<section id="secPed">'+tit+' <span class="mut">('+L.length+' em aberto · '+sem+' sem resposta)</span></h2>'+
    '<p class="mut">Responda cada pedido conforme o que está na obra hoje. <b>Entregue</b> fecha o pedido para todos (se marcar errado, dá para retirar na aba Pedidos do Sienge do painel). A resposta vai junto com o relatório e aparece na aba Pedidos do Sienge.</p>'+
    L.map(function(x){ var v=S.ent[x.n]||'', it=x.itens.slice(0,3).map(function(i){ return esc(String(i[0]).replace(/^\d+\s*-\s*/,''))+' — '+String(i[2]).replace('.',',')+' '+esc(i[1]); }).join(' · ')+(x.itens.length>3?' · +'+(x.itens.length-3)+' item(ns)':'');
      var ant=x.ult?('última marca: '+({E:'Entregue',P:'Parcial',N:'Não entregue'}[x.ult]||x.ult)+(x.por?' por '+esc(x.por):'')+(x.quando?' em '+esc(x.quando):'')):(x.se==='S'?'sem baixa no Sienge':x.se==='P'?'parcial pelo Sienge':'pendente no Sienge');
      return '<div class="pd'+(v?'':' falta')+'" data-p="'+x.n+'"><div class="h"><b>'+x.n+'</b> · '+esc(x.data)+' · '+esc(x.forn)+'</div><div class="it">'+(it||'—')+'<br>'+ant+'</div>'+
        '<div class="sb">'+STP.map(function(o){ return '<button data-s="'+o[0]+'" class="'+o[0]+(v===o[0]?' on':'')+'">'+o[1]+'</button>'; }).join('')+'</div></div>'; }).join('')+secSolic()+secCanc()+'</section>'; }
function secSolic(){ var L=solicAbertas(), dt=(window.SIENGE_SOLIC_ABDT||{})[String(S.obra)]||'';
  /* 09/10 (Luis): pedido de material que ainda não virou ordem de compra TEM de aparecer na visita.
     A lista vem do Acompanhamento de Solicitações do Sienge; o que foi pedido depois da última
     atualização ainda não está nela -> o engenheiro acrescenta aqui e vai como pendente no RAO. */
  return '<h3 style="margin:16px 0 4px;font-size:15px">Pedidos de material ainda sem ordem de compra <span class="mut">('+(L.length+(S.solm||[]).length)+')</span></h3>'+
    '<p class="mut">Lista do Sienge'+(dt?' atualizada em <b>'+esc(dt)+'</b>':'')+'. Pedido feito depois disso, ou que não esteja aqui, <b>acrescente no fim</b> — entra no relatório como pendente.</p>'+
    (L.length?'':'<p class="mut">Nenhuma solicitação sem ordem de compra nesta lista.</p>')+
    '<p class="mut">Pedidas no Sienge mas compras ainda não fechou o pedido (sem cotação). Ficam como <b>pendentes</b>. Se puder, diga se ainda precisa, se chegou por outro meio ou se pode cancelar — não é obrigatório.</p>'+
    L.map(function(x){ var v=S.ent[x.k]||'', it=x.itens.slice(0,3).map(function(i){ return esc(String(i[0]).replace(/^\d+\s*-\s*/,''))+' — '+String(i[2]).replace('.',',')+' '+esc(i[1]); }).join(' · ')+(x.itens.length>3?' · +'+(x.itens.length-3)+' item(ns)':'');
      var ant='pendente — sem pedido de compra'+(x.dias?' · solicitada há '+x.dias+' dia(s)':'')+(x.ult?' · última marca: '+(x.obs?esc(x.obs):({N:'ainda precisa',P:'parcial'}[x.ult]||x.ult))+(x.por?' ('+esc(x.por)+')':''):'');
      return '<div class="pd sol" data-p="'+x.k+'"><div class="h"><b>Sol. '+x.sol+'</b> · '+esc(x.data)+' · '+esc(x.fin.slice(0,70))+'</div><div class="it">'+(it||'—')+'<br>'+ant+'</div>'+
        '<div class="sb">'+STS.map(function(o){ return '<button data-s="'+o[0]+'" class="'+o[0]+(v===o[0]?' on':'')+'">'+o[1]+'</button>'; }).join('')+'</div></div>'; }).join('')+secSolManual(); }
function secSolManual(){ var M=S.solm||[];
  return M.map(function(m,i){ return '<div class="pd sol man"><div class="h"><b>'+(m.sol?'Sol. '+esc(m.sol):'Pedido sem nº')+'</b> · informado nesta visita</div><div class="it">'+esc(m.desc)+(m.qtd?' — '+esc(m.qtd):'')+'<br>pendente — ainda sem ordem de compra</div>'+
      '<div class="smx"><button data-solrm="'+i+'" type="button">Tirar da lista</button></div></div>'; }).join('')+
    '<div class="solAdd"><b>Acrescentar pedido que não aparece</b>'+
    '<input id="smSol" inputmode="numeric" placeholder="nº da solicitação (se tiver)">'+
    '<input id="smDesc" placeholder="material (ex.: cimento CP-II, tubo PVC 50 mm)">'+
    '<input id="smQtd" placeholder="quantidade (ex.: 20 sacos)">'+
    '<button id="btSolAdd" type="button">+ Acrescentar</button></div>'; }
function secCanc(){ var L=pedidosCancelados(); if(!L.length) return '';
  return '<details class="canc"><summary>'+L.length+' pedido(s) cancelado(s) — não precisam de resposta</summary><ul>'+
    L.map(function(x){ return '<li><b>'+x.n+'</b> · '+esc(x.data)+' · '+esc(x.forn)+' — <s>cancelado</s>'+(x.por?' por '+esc(x.por):'')+(x.quando?' em '+esc(x.quando):'')+'</li>'; }).join('')+'</ul></details>'; }
function pintaPedidos(){ var e=document.getElementById('secPed'); if(e) e.outerHTML=secPedidos(); }
var S; try{ S=JSON.parse(ls(CH)||'null'); }catch(e){ S=null; }
if(!S||S.v!==1) S=novo();
if(!S.ent) S.ent={};
if(Q.get('obra')&&String(S.obra)!==Q.get('obra')&&!Object.keys(S.r).length&&!Object.keys(S.t).length) S=novo();
var F=[]; try{ F=JSON.parse(ls(CHF)||'[]'); }catch(e){ F=[]; }   /* [{u:dataURL,l:legenda}] */
function salva(){ ls(CH,JSON.stringify(S)); try{ localStorage.setItem(CHF,JSON.stringify(F)); }catch(e){ msg('Fotos demais para guardar no rascunho — envie logo ou tire alguma.'); } }
function nomeObra(c){ var o=OBRAS.filter(function(x){return String(x[0])===String(c);})[0]; return o?o[1]:''; }
function msg(t){ document.getElementById('msg').textContent=t; }

function render(){
  var h='<section><h2>Visita</h2><div class="grid">'+
    '<label class="f">Obra <b class="ast">*</b><select id="fObra"><option value="">escolha…</option>'+OBRAS.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(S.obra)?' selected':'')+'>'+o[0]+' — '+esc(o[1])+'</option>';}).join('')+'</select></label>'+
    '<label class="f">Data da visita <b class="ast">*</b><input type="date" id="fData" value="'+esc(S.data)+'"></label>'+
    '<label class="f">Hora da visita<input type="time" id="fHora" value="'+esc(S.hora)+'"></label>'+
    '<label class="f">Número de funcionários<input type="number" min="0" id="fFunc" value="'+esc(S.func)+'"></label>'+
    '<label class="f">% executado da obra (sua avaliação) <b class="ast">*</b><input type="number" min="0" max="100" step="1" inputmode="numeric" id="fPct" value="'+esc(S.pct||'')+'" placeholder="0 a 100"></label>'+
    '<label class="f">Quem preencheu <b class="ast">*</b><input id="fQuem" list="engs" value="'+esc(S.quem)+'" placeholder="Eng. …"><datalist id="engs">'+ENG.map(function(e){return '<option value="'+esc(e)+'">';}).join('')+'</datalist></label>'+
    '</div></section>';
  h+='<section><h2>Itens verificados</h2>'+PERG.map(function(p){ var v=S.r[p[0]]||'';
      return '<div class="q" data-k="'+p[0]+'"><div class="t">'+esc(p[1])+'</div><div class="seg">'+p[2].map(function(o){
        var ruim=new RegExp('^('+(RUIM[p[0]]||'#')+')$').test(o);
        return '<button data-v="'+esc(o)+'" class="'+(v===o?'on':'')+(ruim?' r':'')+'">'+esc(o)+'</button>'; }).join('')+'</div></div>'; }).join('')+'</section>';
  h+='<section><h2>Anotações</h2>'+TXT.map(function(t){ return '<label class="f">'+esc(t[1])+(t[0]==='servicos'?' <b class="ast">*</b>':'')+
      '<textarea data-t="'+t[0]+'" placeholder="'+esc(t[2])+'">'+esc(S.t[t[0]]||'')+'</textarea></label>'; }).join('')+'</section>';
  h+=secPedidos();
  h+='<section><h2>Fotos <span class="mut" id="nF"></span></h2>'+
    '<p class="mut">Até '+MAXF+' fotos. Cada foto é reduzida no próprio celular antes de enviar. Não enviar foto em que dê para identificar aluno — o relatório vai para o painel.</p>'+
    '<input type="file" accept="image/*" multiple id="fFotos"><div class="fotos" id="fotos"></div></section>';
  h+='<section><div id="resultado"></div><p class="mut">No relatório entram três percentuais: o % aprovado nas medições, o % executado que você informou acima e o último % do fiscal da FDE no livro de ocorrências — sem valores em reais. A previsão de término e os pedidos do Sienge entram sozinhos. O relatório aparece na aba <b>Relatório de visita</b> da obra depois da rodada no Mac.</p></section>';
  document.getElementById('app').innerHTML=h; desenhaFotos(); topo();
}
function topo(){ document.getElementById('hObra').textContent=S.obra?(S.obra+' — '+nomeObra(S.obra)):'escolha a obra'; }
function desenhaFotos(){
  document.getElementById('nF').textContent='('+F.length+' de '+MAXF+')';
  document.getElementById('fotos').innerHTML=F.map(function(f,i){ return '<div class="ft"><img src="'+f.u+'" alt="foto '+(i+1)+'"><button class="x" data-rm="'+i+'">×</button>'+
    '<input data-leg="'+i+'" value="'+esc(f.l||'')+'" placeholder="legenda (ex.: Pintura - fachada)"></div>'; }).join('');
}
function reduz(f){ return new Promise(function(ok){ var r=new FileReader(); r.onload=function(){ var im=new Image(); im.onload=function(){
  var m=1280, s=Math.min(1,m/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',0.62)); }; im.onerror=function(){ ok(null); }; im.src=r.result; }; r.readAsDataURL(f); }); }

document.addEventListener('click',function(e){ var t=e.target;
  if(t.matches('.sb button')){ var pn=t.closest('.pd').dataset.p, sv=t.dataset.s; if(S.ent[pn]===sv) delete S.ent[pn]; else S.ent[pn]=sv; salva(); var y=window.scrollY; pintaPedidos(); window.scrollTo(0,y); return; }
  if(t.matches('.seg button')){ var k=t.closest('.q').dataset.k, v=t.dataset.v; S.r[k]=(S.r[k]===v?undefined:v); if(!S.r[k]) delete S.r[k];
    t.closest('.seg').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.dataset.v===S.r[k]); }); salva(); return; }
  if(t.dataset.rm!=null){ F.splice(+t.dataset.rm,1); salva(); desenhaFotos(); return; }
  if(t.dataset.solrm!=null){ (S.solm=S.solm||[]).splice(+t.dataset.solrm,1); salva(); var y2=window.scrollY; pintaPedidos(); window.scrollTo(0,y2); return; }
  if(t.id==='btSolAdd'){ var ds=(document.getElementById('smDesc').value||'').trim(), sn=(document.getElementById('smSol').value||'').replace(/\D/g,''), qq=(document.getElementById('smQtd').value||'').trim();
    if(!ds&&!sn){ msg('Escreva o material ou o nº da solicitação.'); return; }
    (S.solm=S.solm||[]).push({sol:sn,desc:ds,qtd:qq}); salva(); var y3=window.scrollY; pintaPedidos(); window.scrollTo(0,y3); msg('Pedido acrescentado.'); return; }
  if(t.id==='btLimpar'){ if(!limpar){ limpar=true; msg('Clique de novo em Limpar para apagar este rascunho.'); setTimeout(function(){limpar=false;},4000); return; }
    var q=S.quem; S=novo(); S.quem=q; F=[]; salva(); render(); msg('Rascunho apagado.'); return; }
  if(t.id==='btEnviar'){ enviar(); }
});
var limpar=false;
document.addEventListener('input',function(e){ var t=e.target, d=t.dataset;
  if(t.id==='fObra'){ S.obra=t.value; S.ent={}; S.solm=[]; topo(); pintaPedidos(); }
  else if(t.id==='fData') S.data=t.value; else if(t.id==='fHora') S.hora=t.value; else if(t.id==='fFunc') S.func=t.value; else if(t.id==='fPct') S.pct=t.value;
  else if(t.id==='fQuem'){ S.quem=t.value; ls(CHQ,t.value); }
  else if(d.t) S.t[d.t]=t.value; else if(d.leg!=null) F[+d.leg].l=t.value; else return;
  salva(); });
document.addEventListener('change',function(e){ var t=e.target; if(t.id!=='fFotos') return;
  var fs=[].slice.call(t.files||[]), cabe=MAXF-F.length; if(fs.length>cabe){ msg('Só cabem mais '+cabe+' foto(s); as demais ficaram de fora.'); fs=fs.slice(0,cabe); }
  if(!fs.length) return; msg('Reduzindo '+fs.length+' foto(s)…');
  Promise.all(fs.map(reduz)).then(function(us){ us.filter(Boolean).forEach(function(u){ F.push({u:u,l:''}); }); t.value=''; salva(); desenhaFotos(); msg(F.length+' foto(s) anexada(s).'); });
});
function faltas(){ var f=[];
  if(!S.obra) f.push('a obra'); if(!S.data) f.push('a data da visita'); else if(S.data>hoje()) f.push('a data da visita (está no futuro: '+S.data.split('-').reverse().join('/')+')'); if(!(S.quem||'').trim()) f.push('quem preencheu');
  var pc=String(S.pct==null?'':S.pct).replace(',','.').trim(); if(pc===''||isNaN(+pc)||+pc<0||+pc>100) f.push('o % executado da obra (0 a 100)');
  if(!(S.t.servicos||'').trim()) f.push('os serviços executados');
  var semP=pedidosAbertos().filter(function(x){ return !S.ent[x.n]; }).length; if(semP) f.push('a entrega de '+semP+' pedido(s) do Sienge');
  var semR=PERG.filter(function(p){ return !S.r[p[0]]; }).map(function(p){ return p[1].toLowerCase(); }); if(semR.length) f.push('responder: '+semR.join(', '));
  return f; }
function posta(o){ var fd=new FormData(); fd.append(SRV.entry,JSON.stringify(o)); return fetch(SRV.form,{method:'POST',mode:'no-cors',body:fd}); }
var enviando=false;
function enviar(){ if(enviando) return;
  var f=faltas(); if(f.length){ document.getElementById('resultado').innerHTML='<div class="aviso">Falta: '+esc(f.join('; '))+'.</div>'; msg('Falta preencher alguns campos — veja no fim da página.'); window.scrollTo(0,document.body.scrollHeight); return; }
  enviando=true; var id='v'+S.obra+'-'+Date.now().toString(36);
  var abertos={}; pedidosAbertos().forEach(function(x){ abertos[x.n]=1; }); solicAbertas().forEach(function(x){ abertos[x.k]=1; }); Object.keys(S.ent).forEach(function(k){ if(!abertos[k]) delete S.ent[k]; });
  var dd=new Date(), qd=dd.toLocaleDateString('pt-BR')+' '+dd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var sgE={}; pedidosAbertos().forEach(function(x){ if(x.sgE) sgE[x.n]=1; });
  var marcas=Object.keys(S.ent).map(function(k){ return {pedido:+k,s:S.ent[k],obs:'',por:S.quem,quando:qd,trava:S.ent[k]==='E'&&+k>0,sg:!!sgE[k],origem:'visita '+S.obra}; });
  var d=JSON.parse(JSON.stringify(S)); d.parte='rao'; d.marcas=marcas; d.idv=id; d.unidade=nomeObra(S.obra); d.enviado=new Date().toISOString();
  d.fotos=F.map(function(x,i){ return {i:i,l:x.l||''}; });
  var pecas=[]; F.forEach(function(x,i){ var b=(x.u.split(',')[1]||''), n=Math.ceil(b.length/30000);
    for(var k=0;k<n;k++) pecas.push({v:1,parte:'rao_foto',idv:id,f:i,k:k,n:n,b:b.slice(k*30000,(k+1)*30000)}); });
  var tot=pecas.length+1, feito=0; msg('Enviando 1 de '+tot+'…');
  function postaEnt(m){ if(!ESRV.form) return Promise.resolve(); var fd=new FormData(); fd.append(ESRV.entry,JSON.stringify(m)); return fetch(ESRV.form,{method:'POST',mode:'no-cors',body:fd}); }
  posta(d).then(function(){ return Promise.all(marcas.map(postaEnt)); }).then(function(){ feito++; return pecas.reduce(function(p,pc){ return p.then(function(){ return posta(pc).then(function(){ feito++; msg('Enviando '+feito+' de '+tot+'… (não feche a página)'); }); }); },Promise.resolve()); })
  .then(function(){ enviando=false; var ob=S.obra, n=F.length, q=S.quem; S=novo(); S.quem=q; S.obra=ob; F=[]; salva(); render();
    document.getElementById('resultado').innerHTML='<div class="okmsg"><b>Relatório enviado.</b> Código '+esc(id)+' · obra '+esc(ob)+' · '+n+' foto(s).'+
      '<div class="mut">Ele entra na aba Relatório de visita da obra na próxima rodada. O rascunho foi apagado deste aparelho.</div></div>';
    msg('Enviado (código '+id+').'); window.scrollTo(0,document.body.scrollHeight); })
  .catch(function(){ enviando=false; msg('Sem conexão — o rascunho continua salvo; tente enviar de novo.'); });
}
render();
lerServidor().then(pintaPedidos);
})();
</script>
